<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한마디 영어</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  /* layout: one phone column, flat white, list rows with hairlines, one fixed action at the bottom */
  --bg:#ffffff; --fill:#f2f4f6; --ink:#191f28; --sub:#6b7684; --faint:#b0b8c1; --line:#e5e8eb;
  --brand:#2f6bff; --on-brand:#ffffff; --ok:#00a86b; --ok-bg:#e8f8f0; --no:#f04452; --no-bg:#fff0f1; --mark:#ffe27a;
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#17171c; --fill:#24242c; --ink:#f2f4f6; --sub:#9ea4ae; --faint:#5a606b; --line:#2e2f38;
    --brand:#5b8cff; --on-brand:#ffffff; --ok:#2fd08b; --ok-bg:#15291f; --no:#ff6b76; --no-bg:#33191c; --mark:#6b5a14;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);word-break:keep-all;-webkit-text-size-adjust:100%}
h1,h2,h3,p,ol,ul{margin:0;padding:0}
ol,ul{list-style:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none !important}
#app{max-width:480px;margin:0 auto;padding:24px 20px 190px}
.fixed{position:fixed;left:0;right:0;margin:0 auto;max-width:480px}

/* tabs + bottom action */
.tabs{bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;display:grid;justify-items:center;gap:2px;padding:9px 0 8px;font-size:11px;font-weight:600;color:var(--faint)}
.tabs button.on{color:var(--ink)}
.cta-wrap{bottom:calc(58px + env(safe-area-inset-bottom));padding:12px 20px;background:linear-gradient(transparent,var(--bg) 30%)}
.cta{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border-radius:16px;background:var(--brand);color:var(--on-brand);font-size:17px;font-weight:700}
.cta.dark{background:var(--ink);color:var(--bg)}
.cta:active{transform:scale(.98)}

/* today */
.date{font-size:14px;color:var(--sub);font-weight:500}
.hero{font-size:26px;font-weight:800;line-height:1.3;letter-spacing:-.02em;margin-top:4px;text-wrap:balance}
.week{display:flex;justify-content:space-between;margin:26px 0 8px}
.week li{display:grid;justify-items:center;gap:8px;font-size:12px;color:var(--sub);font-weight:500}
.week i{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--fill);color:transparent}
.week .did i{background:var(--brand);color:var(--on-brand)}
.week .now{color:var(--ink);font-weight:700}
.week .now:not(.did) i{box-shadow:inset 0 0 0 2px var(--brand);background:transparent}
.sec{font-size:13px;font-weight:700;color:var(--sub);margin:30px 0 4px}
.rows li+li{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 0;min-height:68px}
.row .ic{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:12px;background:var(--fill);font-weight:800;font-size:15px;color:var(--sub);font-variant-numeric:tabular-nums}
.row .ic.done{background:var(--ok-bg);color:var(--ok)}
.row .tx{flex:1;min-width:0;display:grid}
.row b{font-size:17px;font-weight:700}
.row small{font-size:14px;color:var(--sub)}
.row .go{color:var(--faint);flex:none}
.row .chip{flex:none;font-size:13px;font-weight:700;color:var(--brand)}
.row.off b{color:var(--sub)}
.unit{font-size:20px;font-weight:800;margin:30px 0 2px;letter-spacing:-.01em}
.unit:first-child{margin-top:0}
.ptitle{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:22px}

/* stats */
.big{display:flex;align-items:baseline;gap:6px;margin-bottom:22px}
.big b{font-size:60px;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big span{font-size:18px;font-weight:700}
.three{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.three div{flex:1;padding:16px 0}
.three div+div{border-left:1px solid var(--line);padding-left:16px}
.three b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.three span{font-size:13px;color:var(--sub)}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:14px}
.bars li{flex:1;display:grid;grid-template-rows:auto 1fr auto;justify-items:center;gap:6px;height:100%;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.bars .col{align-self:end;width:100%;border-radius:8px 8px 4px 4px;background:var(--fill);min-height:4px}
.bars .now .col{background:var(--brand)}
.bars .now{color:var(--ink);font-weight:700}
.note{font-size:13px;color:var(--sub);margin-top:26px;line-height:1.6}

/* session */
.sbar{display:flex;align-items:center;gap:14px;margin:-6px 0 34px}
.x{display:grid;place-items:center;width:40px;height:40px;margin-left:-10px;color:var(--sub)}
.prog{flex:1;height:8px;border-radius:99px;background:var(--fill);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .25s}
.ex{padding-bottom:120px}
.inst{font-size:15px;font-weight:700;color:var(--brand);margin-bottom:14px}
.en{font-size:30px;font-weight:800;line-height:1.25;letter-spacing:-.02em;overflow-wrap:anywhere}
.say{font-size:17px;color:var(--sub);margin-top:10px}
.ko{font-size:17px;margin-top:4px}
.koq{font-size:28px;font-weight:800;line-height:1.3;letter-spacing:-.02em}
.auds{display:flex;gap:8px;margin-top:22px}
.aud{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:99px;background:var(--fill);font-size:15px;font-weight:600}
.txt{font-size:14px;font-weight:600;color:var(--sub);text-decoration:underline;text-underline-offset:3px;min-height:40px}
.hintb{margin-top:18px}
.ans{margin-top:22px;padding:16px 18px;border-radius:16px;background:var(--fill)}
.ans .en{font-size:22px}
.them{display:inline-block;max-width:92%;padding:14px 18px;border-radius:4px 20px 20px 20px;background:var(--fill)}
.them .t-en{font-size:20px;font-weight:700}
.them .t-ko{font-size:14px;color:var(--sub);margin-top:2px}
.narr{font-size:16px;color:var(--sub)}
.reply{margin-top:30px}
.reply small{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:4px}
.frame{font-size:28px;font-weight:800;line-height:1.3;letter-spacing:-.02em}
.frame u{text-decoration:none;display:inline-block;min-width:54px;border-bottom:4px solid var(--brand)}
.swap{margin-top:26px}
.swap li{display:flex;justify-content:space-between;gap:12px;padding:14px 0;font-size:17px}
.swap li+li{border-top:1px solid var(--line)}
.swap b{font-weight:700}
.swap span{color:var(--sub)}
.word{display:inline-block;margin-top:14px;padding:6px 12px;border-radius:10px;background:var(--fill);font-size:15px;font-weight:600}
.bigplay{display:grid;place-items:center;width:96px;height:96px;border-radius:50%;background:var(--brand);color:var(--on-brand);margin:6px 0 30px}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;padding:16px 18px;border-radius:16px;background:var(--fill);font-size:17px;font-weight:600;min-height:58px}
.opt.ok{background:var(--ok-bg);color:var(--ok)}
.opt.no{background:var(--no-bg);color:var(--no)}

/* dock */
.dock{bottom:0;display:grid;justify-items:center;gap:6px;padding:14px 20px calc(16px + env(safe-area-inset-bottom));background:var(--bg)}
.dock.ok{background:var(--ok-bg)}
.dock.no{background:var(--no-bg)}
.heard{min-height:24px;font-size:16px;color:var(--sub);text-align:center}
.micbtn{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:var(--brand);color:var(--on-brand)}
.micbtn.on{background:var(--no);animation:ring 1.2s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(240,68,82,.45)}100%{box-shadow:0 0 0 22px rgba(240,68,82,0)}}
@media (prefers-reduced-motion:reduce){.micbtn.on{animation:none}.prog i{transition:none}}
.mic-l{font-size:15px;font-weight:700}
.kf{display:flex;gap:8px;width:100%}
.kf input{flex:1;min-width:0;min-height:52px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:17px}
.kf button{min-height:52px;padding:0 18px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700}
.fb{display:grid;gap:8px;width:100%;justify-items:start}
.fb-t{font-size:20px;font-weight:800}
.ok .fb-t{color:var(--ok)}
.no .fb-t{color:var(--no)}
.words{font-size:22px;font-weight:700;line-height:1.5}
.w.hit{background:linear-gradient(transparent 58%,var(--mark) 58%)}
.w.miss{color:var(--no);text-decoration:underline wavy;text-underline-offset:5px}
.fb .sub{font-size:14px;color:var(--sub);overflow-wrap:anywhere}
.fb .cta{margin-top:8px}
.ok .cta{background:var(--ok)}
.fb .txt{justify-self:center}

/* finish */
.fin{padding-top:56px}
.fin h1{font-size:30px;font-weight:800;line-height:1.3;letter-spacing:-.02em}
.fin .rows{margin-top:30px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fin .rows li{display:flex;justify-content:space-between;padding:16px 0;font-size:17px}
.fin .rows b{font-weight:800;font-variant-numeric:tabular-nums}
</style>
</head>

/* ---------- grading ---------- */
const FIX={"i'm":"i am","im":"i am","i'll":"i will","it's":"it is","its":"it is","don't":"do not","dont":"do not","how's":"how is",
  "1":"one","2":"two","3":"three","4":"four","5":"five","ok":"okay","thankyou":"thank you","thanks":"thank you",
  "checkout":"check out","wi-fi":"wifi","restroom":"rest room","latte":"latte"};
function toks(w){
  w=w.toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9'-]/g,"").replace(/^-+|-+$/g,"");
  if(!w)return [];
  w=FIX[w]||w.replace(/-/g,"");
  return (FIX[w]||w).split(" ");
}
function grade(target,said){
  const ow=target.split(/\s+/),t=[],owner=[];
  ow.forEach((w,i)=>toks(w).forEach(k=>{t.push(k);owner.push(i);}));
  const s=said.split(/\s+/).flatMap(toks);
  const m=t.length,n=s.length,dp=[];
  for(let i=0;i<=m;i++)dp.push(new Array(n+1).fill(0));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=t[i-1]===s[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  const hit=new Array(m).fill(false);
  let i=m,j=n;
  while(i>0&&j>0){
    if(t[i-1]===s[j-1]){hit[i-1]=true;i--;j--;}
    else if(dp[i-1][j]>=dp[i][j-1])i--;else j--;
  }
  const words=ow.map((w,idx)=>({text:w,hit:owner.every((o,k)=>o!==idx||hit[k])}));
  return {score:m?dp[m][n]/m:0,words};
}

function startLesson(id){
  const l=LMAP[id],q=[];
  l.ph.forEach(p=>q.push({t:"learn",p:p,en:p.en}));

    const others=shuffle(l.ph.filter((x,k)=>k!==i)).slice(0,2).map(x=>x.ko);
    q.push({t:"listen",p:l.ph[i],opts:shuffle([l.ph[i].ko].concat(others))});
  });
  shuffle(l.ph).forEach(p=>q.push({t:"recall",p:p,en:p.en}));
  q.push({t:"frame",l:l});
  l.pat.items.forEach(p=>q.push({t:"pat",p:p,en:p.en,l:l}));
  l.talk.forEach(tk=>q.push({t:"talk",tk:tk,p:l.ph[tk.you],en:l.ph[tk.you].en,l:l}));
  S={kind:"lesson",id:id,q:q,i:0,said:0};showEx();
}

    auto=p.en;
  }else if(ex.t==="recall"){
    m='<p class="inst">'+(S.kind==="review"?"기억나는 대로 영어로 말해요":"이번엔 안 보고 영어로 말해요")+'</p><h1 class="koq">'+esc(p.ko)+'</h1>'+hidden(p);
  }else if(ex.t==="frame"){
    const f=esc(ex.l.pat.frame).replace("___","<u>&nbsp;</u>");
    m='<p class="inst">단어만 바꾸면 새 문장이 돼요</p><h1 class="frame" lang="en">'+f+'</h1><ul class="swap">'
     +ex.l.pat.items.map(x=>'<li><b lang="en">'+esc(x.w)+'</b><span>'+esc(x.wk)+'</span></li>').join("")+'</ul>';
  }else if(ex.t==="pat"){
    const f=esc(ex.l.pat.frame).replace("___","<u>&nbsp;</u>");
    m='<p class="inst">빈칸에 넣어 말해요</p><h1 class="koq">'+esc(p.ko)+'</h1><p class="say" lang="en">'+f+'</p><span class="word">'+esc(p.wk)+' = '+esc(p.w)+'</span>'+hidden(p);
  }else{
    const tk=ex.tk;
    m='<p class="inst">'+esc(ex.l.sub)+'</p>'
     +(tk.them?'<div class="them"><p class="t-en" lang="en">'+esc(tk.them)+'</p><p class="t-ko">'+esc(tk.ko)+'</p></div>'+auds(tk.them):'<p class="narr">'+esc(tk.ko)+'</p>')
     +'<div class="reply"><small>이렇게 답해요</small><h1 class="koq">'+esc(p.ko)+'</h1>'+hidden(p)+'</div>';
    auto=tk.them;
  }
  app.innerHTML='<header class="sbar"><button type="button" class="x" id="quit" aria-label="그만하기">'+I.x+'</button><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="'+S.q.length+'" aria-valuenow="'+S.i+'"><i style="width:'+Math.round(S.i/S.q.length*100)+'%"></i></div></header><main class="ex">'+m+'</main>';
  chrome.innerHTML='<div class="dock fixed" id="dock"></div>';
  window.scrollTo(0,0);
  $("#quit").addEventListener("click",()=>{save();show();});
  bindAud(app);
  const hb=$("#hint");
  if(hb)hb.addEventListener("click",()=>{S.hint=true;reveal();});
  if(ex.t==="listen")bindListen(ex);
  else if(ex.t==="frame"){
    $("#dock").innerHTML='<button type="button" class="cta" id="nx">말해 볼게요</button>';
    $("#nx").addEventListener("click",next);
  }else dockMic(ex);
  if(auto)speak(auto,0.9);
}
function bindAud(root){root.querySelectorAll("[data-say]").forEach(b=>b.addEventListener("click",()=>{stopMic();speak(b.dataset.say,+b.dataset.rate);}));}
function reveal(){const a=$("#ans"),h=$("#hint");if(a){a.hidden=false;bindOnce(a);}if(h)h.hidden=true;}
function bindOnce(a){if(a.dataset.b)return;a.dataset.b="1";bindAud(a);}
function next(){
  S.i++;
  if(S.i>=S.q.length)finish();else showEx();
}
function bindListen(ex){
  const dock=$("#dock");
  app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    if(b.textContent===ex.p.ko){
      app.querySelectorAll(".opt").forEach(o=>{o.disabled=true;});
      b.classList.add("ok");
      dock.className="dock fixed ok";
      dock.innerHTML='<div class="fb"><p class="fb-t">맞아요</p><p class="words" lang="en">'+esc(ex.p.en)+'</p><p class="sub">'+esc(ex.p.say)+'</p><button type="button" class="cta" id="nx">다음</button></div>';
      $("#nx").addEventListener("click",next);
    }else{b.classList.add("no");b.disabled=true;}
  }));
}
function dockMic(ex){
  const dock=$("#dock");
  dock.className="dock fixed";
  dock.innerHTML='<p class="heard" id="heard" aria-live="polite"></p>'
   +(SR?'<button type="button" class="micbtn" id="mic" aria-label="눌러서 말하기">'+I.mic+'</button><p class="mic-l" id="micl">눌러서 말하기</p><button type="button" class="txt" id="kb">키보드로 입력</button>':"")
   +'<form class="kf" id="kf"'+(SR?" hidden":"")+'><label class="sr" for="kin">영어로 입력</label><input id="kin" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 입력"><button type="submit">확인</button></form>';
  const heard=$("#heard"),kf=$("#kf"),kin=$("#kin");
  kf.addEventListener("submit",e=>{e.preventDefault();const t=kin.value.trim();if(t)answer(ex,t,[]);});
  if(!SR)return;
  const mic=$("#mic"),micl=$("#micl");
  $("#kb").addEventListener("click",()=>{kf.hidden=false;$("#kb").hidden=true;kin.focus();});
  const setOn=on=>{mic.classList.toggle("on",on);micl.textContent=on?"듣고 있어요":"눌러서 말하기";};
  mic.addEventListener("click",()=>{
    if(rec){try{rec.stop();}catch(e){}return;}
    try{speechSynthesis.cancel();}catch(e){}
    const r=new SR();rec=r;
    r.lang="en-US";r.interimResults=true;r.continuous=false;r.maxAlternatives=3;
    const finals=[],alts=[];let err="";
    heard.textContent="";
    r.onstart=()=>setOn(true);
    r.onresult=e=>{
      let live="";
      for(let i=e.resultIndex;i<e.results.length;i++){
        const res=e.results[i];
        if(res.isFinal){finals.push(res[0].transcript);if(finals.length===1)for(let k=1;k<res.length;k++)alts.push(res[k].transcript);}
        else live+=res[0].transcript;
      }
      heard.textContent=(finals.join(" ")+" "+live).trim();
    };
    r.onerror=e=>{err=e.error||"error";};
    r.onend=()=>{
      if(rec===r)rec=null;
      if(!mic.isConnected||err==="aborted")return;
      setOn(false);
      if(err==="not-allowed"||err==="service-not-allowed"){heard.textContent="마이크 권한이 꺼져 있어요. 주소창 왼쪽 아이콘에서 마이크를 허용해 주세요.";return;}
      const text=finals.join(" ").trim();
      if(!text){heard.textContent="잘 안 들렸어요. 한 번 더 눌러 말해 주세요.";return;}
      answer(ex,text,finals.length===1?alts:[]);
    };
    try{r.start();}catch(e){rec=null;setOn(false);heard.textContent="마이크를 켤 수 없어요. 키보드로 입력해 주세요.";}
  });
}
function answer(ex,text,alts){
  let g=grade(ex.en,text);
  (alts||[]).forEach(a=>{const x=grade(ex.en,a);if(x.score>g.score){g=x;text=a;}});
  const ok=g.score>=0.7,dock=$("#dock");
  const words=g.words.map(w=>'<span class="w '+(w.hit?"hit":"miss")+'">'+esc(w.text)+'</span>').join(" ");
  if(ok){
    const clean=S.first&&!S.hint;
    S.said++;P.days[today()]=(P.days[today()]||0)+1;
    if(ex.card)grow(ex.card,clean);
    save();
    try{navigator.vibrate&&navigator.vibrate(20);}catch(e){}
    reveal();
    dock.className="dock fixed ok";
    dock.innerHTML='<div class="fb"><p class="fb-t">'+(g.score===1?"정확해요":"좋아요, 통해요")+'</p><p class="words" lang="en">'+words+'</p><button type="button" class="cta" id="nx">다음</button></div>';
    $("#nx").addEventListener("click",next);
  }else{
    S.first=false;S.fails++;
    reveal();
    dock.className="dock fixed no";
    dock.innerHTML='<div class="fb"><p class="fb-t">조금만 더요</p><p class="words" lang="en">'+words+'</p><p class="sub">내가 한 말: '+esc(text)+'</p><button type="button" class="cta dark" id="re">다시 말하기</button>'
     +(S.fails>=2?'<button type="button" class="txt" id="skip">일단 넘어가기</button>':"")+'</div>';
    $("#re").addEventListener("click",()=>dockMic(ex));
    const sk=$("#skip");
    if(sk)sk.addEventListener("click",()=>{if(ex.card){grow(ex.card,false);save();}next();});
  }
}
function grow(k,clean){
  const c=P.cards[k];if(!c)return;
  c.lv=clean?Math.min(c.lv+1,INT.length-1):0;
  c.due=plusDays(INT[c.lv]);
}
function finish(){
  let extra="";
  if(S.kind==="lesson"){
    const l=LMAP[S.id];
    P.done[l.id]=true;addCards(l,plusDays(1));
    extra='<li><span>내일 복습할 문장</span><b>'+(l.ph.length+l.pat.items.length)+'개</b></li>';
  }
  save();
  const st=streak(),title=S.kind==="lesson"?esc(LMAP[S.id].title)+" 수업을 마쳤어요":"복습을 마쳤어요";
  app.innerHTML='<div class="fin"><h1>'+title+'</h1><ul class="rows"><li><span>방금 영어로 말한 횟수</span><b>'+S.said+'번</b></li><li><span>연속 학습</span><b>'+st+'일</b></li>'+extra+'</ul></div>';
  chrome.innerHTML='<div class="dock fixed"><button type="button" class="cta" id="home">확인</button></div>';
  $("#home").addEventListener("click",()=>{tab="today";show();window.scrollTo(0,0);});
  S=null;
}
load();show();
</script>
