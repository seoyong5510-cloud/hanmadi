<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한마디 영어</title>
<meta name="theme-color" content="#2c47d6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one phone-width column. Highlighter yellow marks the words you said right. */
  --bg:#f2f4fa; --surface:#ffffff; --ink:#141b34; --muted:#5b6485; --line:#dde2ef;
  --accent:#2c47d6; --on-accent:#ffffff; --mark:#ffdc5c; --good:#17855a; --bad:#c93a55;
  --f-display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-en:"Lexend","IBM Plex Sans KR",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1222; --surface:#181d33; --ink:#eef0fa; --muted:#9ba4c6; --line:#2a3152;
    --accent:#93a4ff; --on-accent:#0e1222; --mark:#6a5a14; --good:#5fd0a0; --bad:#ff8fa3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1222; --surface:#181d33; --ink:#eef0fa; --muted:#9ba4c6; --line:#2a3152;
  --accent:#93a4ff; --on-accent:#0e1222; --mark:#6a5a14; --good:#5fd0a0; --bad:#ff8fa3;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);word-break:keep-all;-webkit-text-size-adjust:100%}
#app{max-width:460px;margin:0 auto;padding:22px 18px 56px;display:grid;gap:20px}
h1,h2,h3,p,ol,dl,dd{margin:0}
ol{padding:0;list-style:none}
h1,h2,h3{text-wrap:balance;line-height:1.25}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none !important}
.eyebrow{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.muted{color:var(--muted);font-size:15px}

/* home */
.top h1{font:400 30px/1.1 var(--f-display)}
.top p{color:var(--muted);font-size:15px;margin-top:4px}
.stats{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.streak{display:flex;align-items:baseline;gap:6px}
.streak .num{font:400 56px/1 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.streak .unit{font-weight:600}
.stats dl{display:flex;gap:18px;margin-left:auto}
.stats dt{font-size:13px;color:var(--muted)}
.stats dd{font-weight:600;font-variant-numeric:tabular-nums}
.today{display:grid;gap:8px;padding:20px 18px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:14px}
.today h2{font-size:22px}
.peek{font:600 17px/1.4 var(--f-en);margin:4px 0 8px}
.peek span{background:linear-gradient(transparent 55%,var(--mark) 55%)}
h3{font-size:15px;color:var(--muted);font-weight:600;margin-bottom:8px}
.list{display:grid;gap:8px}
.list button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;min-height:60px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.list .n{font:400 22px/1 var(--f-display);color:var(--muted);width:22px;font-variant-numeric:tabular-nums}
.list .t{flex:1;display:grid}
.list .t b{font-weight:600}
.list .t small{color:var(--muted);font-size:13px}
.pill{font-size:13px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{border-color:var(--good);color:var(--good);font-weight:600}
.note{font-size:13px;color:var(--muted);padding:10px 12px;border:1px dashed var(--line);border-radius:10px}
footer{font-size:13px;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 20px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;width:100%}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{width:auto;min-height:48px;padding:8px 16px}
.say{display:none;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-size:14px;font-weight:500}
.has-tts .say{display:inline-flex}
.ai-only{display:none}
.has-ai .ai-only{display:inline-flex}

/* lesson */
.bar{display:flex;align-items:center;gap:12px}
.back{min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.steps{flex:1;display:flex;gap:6px}
.steps li{flex:1;font-size:13px;color:var(--muted);padding-top:8px;border-top:4px solid var(--line);text-align:center}
.steps li.past{border-color:var(--good);color:var(--good)}
.steps li.on{border-color:var(--accent);color:var(--ink);font-weight:600}
.lead h2{font-size:22px}
.lead p{color:var(--muted);font-size:15px}
.cards{display:grid;gap:10px}
.card{display:grid;gap:4px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.en{font:600 22px/1.3 var(--f-en);overflow-wrap:anywhere}
.card .en{font-size:19px}
.hangul{color:var(--accent);font-weight:500}
.ko{color:var(--muted);font-size:15px}
.card .say,.focus .say{justify-self:start;margin-top:6px}
.focus{display:grid;gap:6px;padding:20px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bubble{display:grid;gap:4px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px;max-width:90%}
.bubble .en{font-size:18px}
.bubble.me{justify-self:end;border-radius:16px 4px 16px 16px;background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.bubble .tip{font-size:14px;padding-top:8px;margin-top:4px;border-top:1px dashed var(--line)}
.bubble.sys{background:transparent;border-style:dashed;color:var(--muted);font-size:14px;max-width:100%}
.task{display:grid;gap:6px;padding:14px 16px;border:1px dashed var(--accent);border-radius:14px}
.task .ko{color:var(--ink);font-weight:600;font-size:17px}
.linkbtn{justify-self:start;background:none;border:0;padding:6px 0;min-height:36px;color:var(--accent);text-decoration:underline;font-size:14px}

/* answer */
.answer,.inbox{display:grid;gap:10px}
.mic{display:none;align-items:center;justify-content:center;gap:10px;min-height:64px;border-radius:99px;border:2px solid var(--accent);background:var(--surface);font-weight:600;font-size:17px}
.has-mic .mic{display:flex}
.mic .dot{width:14px;height:14px;border-radius:50%;background:var(--accent)}
.mic.on{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.mic.on .dot{background:var(--surface);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.6);opacity:.5}}
@media (prefers-reduced-motion:reduce){.mic.on .dot{animation:none}}
.heard{min-height:1.6em;font:400 15px/1.5 var(--f-en);color:var(--muted);text-align:center}
.typeform{display:flex;gap:8px}
.typeform input{flex:1;min-width:0;min-height:48px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-en)}
.result{display:grid;gap:8px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.verdict{font-weight:600}
.verdict.ok{color:var(--good)}
.verdict.no{color:var(--bad)}
.words{font:600 20px/1.7 var(--f-en)}
.w.hit{background:linear-gradient(transparent 55%,var(--mark) 55%)}
.w.miss{color:var(--bad);border-bottom:2px dashed var(--bad)}
.said{font-size:14px;color:var(--muted);overflow-wrap:anywhere}

/* done + chat */
.done{display:grid;gap:14px;padding:26px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.done h2{font-size:22px}
.chat{display:grid;gap:10px}
.typing{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const LESSONS=[
 {id:"l1",title:"첫인사",place:"처음 만난 이웃과",role:"Tom, a friendly neighbor meeting the learner for the first time.",
  phrases:[
   {en:"Hello.",say:"헬로우",ko:"안녕하세요."},
   {en:"Nice to meet you.",say:"나이스 투 밋 츄",ko:"만나서 반가워요."},
   {en:"How are you?",say:"하우 아 유?",ko:"어떻게 지내세요?"},
   {en:"I'm good, thank you.",say:"아임 굿, 땡큐",ko:"잘 지내요, 고마워요."}],
  talk:[
   {them:"Hi there!",ko:"안녕하세요!",you:0},
   {them:"I'm Tom.",ko:"저는 톰이에요.",you:1},
   {them:"Nice to meet you too.",ko:"저도 반가워요.",you:2},
   {them:"I'm great. How about you?",ko:"아주 좋아요. 당신은요?",you:3}]},
 {id:"l2",title:"자기소개",place:"모임에서 옆자리 사람과",role:"Amy, a friendly person at a small party asking simple questions about the learner.",
  phrases:[
   {en:"I'm from Korea.",say:"아임 프럼 코리아",ko:"저는 한국에서 왔어요."},
   {en:"I live in Seoul.",say:"아이 리브 인 서울",ko:"저는 서울에 살아요."},
   {en:"I work at a company.",say:"아이 워크 앳 어 컴퍼니",ko:"저는 회사에 다녀요."},
   {en:"I like soccer.",say:"아이 라이크 사커",ko:"저는 축구를 좋아해요."}],
  talk:[
   {them:"Where are you from?",ko:"어디에서 오셨어요?",you:0},
   {them:"Oh, nice! Where do you live?",ko:"오, 좋네요! 어디에 사세요?",you:1},
   {them:"What do you do?",ko:"무슨 일을 하세요?",you:2},
   {them:"What do you like?",ko:"뭘 좋아하세요?",you:3}]},
 {id:"l3",title:"카페에서 주문하기",place:"카페 계산대 앞에서",role:"a kind barista taking the learner's order at a cafe.",
  phrases:[
   {en:"Can I get a coffee, please?",say:"캔 아이 겟 어 커피, 플리즈?",ko:"커피 한 잔 주시겠어요?"},
   {en:"Iced, please.",say:"아이스드, 플리즈",ko:"차가운 걸로 주세요."},
   {en:"For here, please.",say:"포 히어, 플리즈",ko:"여기서 마실게요."},
   {en:"How much is it?",say:"하우 머치 이즈 잇?",ko:"얼마예요?"}],
  talk:[
   {them:"Hi! What can I get for you?",ko:"안녕하세요! 무엇을 드릴까요?",you:0},
   {them:"Hot or iced?",ko:"따뜻한 거요, 차가운 거요?",you:1},
   {them:"For here or to go?",ko:"드시고 가세요, 가져가세요?",you:2},
   {them:"Okay, one iced coffee.",ko:"네, 아이스 커피 한 잔이요.",you:3}]},
 {id:"l4",title:"길 묻기",place:"낯선 거리에서",role:"a helpful local person on the street giving the learner simple directions.",
  phrases:[
   {en:"Excuse me.",say:"익스큐즈 미",ko:"실례합니다."},
   {en:"Where is the subway station?",say:"웨어 이즈 더 서브웨이 스테이션?",ko:"지하철역이 어디예요?"},
   {en:"Is it far from here?",say:"이즈 잇 파 프럼 히어?",ko:"여기서 먼가요?"},
   {en:"Thank you so much.",say:"땡큐 쏘 머치",ko:"정말 감사합니다."}],
  talk:[
   {them:"",ko:"지나가는 사람이 보여요. 먼저 말을 걸어 보세요.",you:0},
   {them:"Yes? Can I help you?",ko:"네? 도와드릴까요?",you:1},
   {them:"Go straight. It's on your left.",ko:"쭉 가세요. 왼쪽에 있어요.",you:2},
   {them:"No, just five minutes.",ko:"아니요, 5분이면 돼요.",you:3}]},
 {id:"l5",title:"식당에서",place:"식당 입구와 테이블에서",role:"a polite waiter at a casual restaurant serving the learner.",
  phrases:[
   {en:"A table for two, please.",say:"어 테이블 포 투, 플리즈",ko:"두 명 자리 주세요."},
   {en:"Can I see the menu?",say:"캔 아이 씨 더 메뉴?",ko:"메뉴판 볼 수 있을까요?"},
   {en:"This one, please.",say:"디스 원, 플리즈",ko:"이걸로 주세요."},
   {en:"Check, please.",say:"첵, 플리즈",ko:"계산서 주세요."}],
  talk:[
   {them:"Welcome! How many?",ko:"어서 오세요! 몇 분이세요?",you:0},
   {them:"Right this way.",ko:"이쪽으로 오세요.",you:1},
   {them:"Here you go. What would you like?",ko:"여기 있어요. 무엇을 드시겠어요?",you:2},
   {them:"Did you enjoy your meal?",ko:"식사 맛있게 하셨어요?",you:3}]},
 {id:"l6",title:"옷 가게에서",place:"옷 가게 안에서",role:"a friendly clerk at a clothing store helping the learner.",
  phrases:[
   {en:"I'm just looking.",say:"아임 저스트 루킹",ko:"그냥 구경하는 중이에요."},
   {en:"Do you have a bigger size?",say:"두 유 해브 어 비거 사이즈?",ko:"더 큰 사이즈 있어요?"},
   {en:"Can I try this on?",say:"캔 아이 트라이 디스 온?",ko:"이거 입어 봐도 돼요?"},
   {en:"I'll take it.",say:"아일 테이크 잇",ko:"이걸로 살게요."}],
  talk:[
   {them:"Hi! Can I help you?",ko:"안녕하세요! 도와드릴까요?",you:0},
   {them:"Okay. This jacket is popular.",ko:"네. 이 재킷이 인기 있어요.",you:1},
   {them:"Yes, here is a large.",ko:"네, 여기 라지 사이즈요.",you:2},
   {them:"Sure. How is it?",ko:"그럼요. 어떠세요?",you:3}]}
];
const SPK='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const $=(s,r)=>(r||document).querySelector(s);
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mk=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;};
const byId=id=>LESSONS.find(l=>l.id===id)||LESSONS[0];

/* ---------- progress ---------- */
const KEY="hanmadi-progress";
let P={done:{},streak:0,lastDay:"",count:0};
const savedTo="이 휴대폰";
const dayStr=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>dayStr(new Date());
const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return dayStr(d);};
function clean(o){
  o=o||{};
  return {done:Object.assign({},o.done||{}),streak:Number(o.streak)||0,lastDay:String(o.lastDay||""),count:Number(o.count)||0};
}
function liveStreak(){return (P.lastDay===today()||P.lastDay===yesterday())?P.streak:0;}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}
}
try{const raw=localStorage.getItem(KEY);if(raw)P=clean(JSON.parse(raw));}catch(e){}

/* ---------- speech ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let noMic=!SR,rec=null,micCb=null;
if(SR)document.body.classList.add("has-mic");
if("speechSynthesis" in window){document.body.classList.add("has-tts");try{speechSynthesis.getVoices();}catch(e){}}
function speak(text){
  if(!text||!("speechSynthesis" in window))return;
  try{const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=0.85;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
}
function stopMic(){if(rec){try{rec.abort();}catch(e){}rec=null;}}

/* ---------- grading ---------- */
const FIX={"i'm":"i am","im":"i am","i'll":"i will","it's":"it is","2":"two","5":"five","ok":"okay","thankyou":"thank you","thanks":"thank you"};
function toks(w){
  w=w.toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9']/g,"");
  if(!w)return [];
  return (FIX[w]||w).split(" ");
}
function grade(target,said){
  const ow=target.split(/\s+/),t=[],owner=[];
  ow.forEach((w,i)=>toks(w).forEach(k=>{t.push(k);owner.push(i);}));
  const s=said.split(/\s+/).flatMap(toks);
  const m=t.length,n=s.length,dp=[];
  for(let i=0;i<=m;i++)dp.push(new Array(n+1).fill(0));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=t[i-1]===s[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  const hit=new Array(m).fill(false);
  let i=m,j=n;
  while(i>0&&j>0){
    if(t[i-1]===s[j-1]){hit[i-1]=true;i--;j--;}
    else if(dp[i-1][j]>=dp[i][j-1])i--;else j--;
  }
  const words=ow.map((w,idx)=>({text:w,hit:owner.every((o,k)=>o!==idx||hit[k])}));
  return {score:m?dp[m][n]/m:0,words};
}

/* ---------- input ---------- */
function inputBox(onSubmit,inputId,ph){
  const el=mk("div","inbox");
  el.innerHTML='<button type="button" class="mic" aria-pressed="false"><span class="dot" aria-hidden="true"></span><span class="lbl">눌러서 말하기</span></button>'
    +'<p class="heard" aria-live="polite"></p>'
    +'<form class="typeform"><label class="sr" for="'+inputId+'">영어로 입력</label>'
    +'<input id="'+inputId+'" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="'+esc(ph)+'">'
    +'<button type="submit" class="btn small">확인</button></form>';
  const mic=$(".mic",el),heard=$(".heard",el),form=$("form",el),input=$("input",el),lbl=$(".lbl",mic);
  const me={};micCb=me;
  const setOn=on=>{mic.classList.toggle("on",on);mic.setAttribute("aria-pressed",String(on));lbl.textContent=on?"듣는 중… 말해 보세요":"눌러서 말하기";};
  mic.addEventListener("click",()=>{
    if(!SR)return;
    if(rec){try{rec.stop();}catch(e){}return;}
    try{speechSynthesis.cancel();}catch(e){}
    const r=new SR();rec=r;
    r.lang="en-US";r.interimResults=true;r.continuous=false;r.maxAlternatives=3;
    const finals=[],alts=[];let err="";
    heard.textContent="";
    r.onstart=()=>setOn(true);
    r.onresult=e=>{
      let live="";
      for(let i=e.resultIndex;i<e.results.length;i++){
        const res=e.results[i];
        if(res.isFinal){
          finals.push(res[0].transcript);
          if(finals.length===1)for(let k=1;k<res.length;k++)alts.push(res[k].transcript);
        }else live+=res[0].transcript;
      }
      heard.textContent=(finals.join(" ")+" "+live).trim();
    };
    r.onerror=e=>{err=e.error||"error";};
    r.onend=()=>{
      if(rec===r)rec=null;
      setOn(false);
      if(micCb!==me||err==="aborted")return;
      if(err==="not-allowed"||err==="service-not-allowed"){heard.textContent="마이크 권한이 꺼져 있어요. 주소창 왼쪽 아이콘을 눌러 마이크를 허용해 주세요.";return;}
      const text=finals.join(" ").trim();
      if(!text){heard.textContent="소리가 들리지 않았어요. 한 번 더 눌러 말해 보세요.";return;}
      heard.textContent="";onSubmit(text,finals.length===1?alts:[]);
    };
    try{r.start();}catch(e){rec=null;setOn(false);heard.textContent="마이크를 켤 수 없어요. 아래에 글자로 입력해 주세요.";}
  });
  form.addEventListener("submit",e=>{e.preventDefault();const t=input.value.trim();input.value="";if(t)onSubmit(t,[]);});
  return el;
}
function gradedBox(target,onNext){
  const wrap=mk("div","answer"),res=mk("div","result");res.hidden=true;
  let fails=0;
  const box=inputBox((text,alts)=>{
    let g=grade(target,text);
    (alts||[]).forEach(a=>{const x=grade(target,a);if(x.score>g.score){g=x;text=a;}});
    const ok=g.score>=0.7;
    res.hidden=false;res.textContent="";
    const words=mk("p","words");
    g.words.forEach(w=>{words.append(mk("span",w.hit?"w hit":"w miss",w.text)," ");});
    res.append(
      mk("p","verdict "+(ok?"ok":"no"),ok?(g.score===1?"완벽해요!":"좋아요, 충분히 통해요!"):"조금만 더요. 점선 표시된 단어를 다시 말해 보세요."),
      words,mk("p","said","내가 한 말: "+text));
    if(ok){
      const b=mk("button","btn primary","다음");b.type="button";b.addEventListener("click",onNext);
      res.append(b);box.hidden=true;stopMic();b.focus();
    }else{
      fails++;
      if(fails>=2){const b=mk("button","btn ghost","일단 넘어가기");b.type="button";b.addEventListener("click",onNext);res.append(b);}
    }
  },"ans-input","영어로 입력해도 돼요");
  wrap.append(box,res);
  return wrap;
}

/* ---------- views ---------- */
let view={name:"home"};
function go(v){stopMic();view=v;render();window.scrollTo(0,0);}
function render(){
  micCb=null;
  if(view.name==="home")home();
  else if(view.name==="lesson")lesson();
  else done();
  app.querySelectorAll("[data-home]").forEach(b=>b.addEventListener("click",()=>go({name:"home"})));
  app.querySelectorAll("[data-start]").forEach(b=>b.addEventListener("click",()=>go({name:"lesson",id:b.dataset.start,step:0,i:0,hint:false})));
  app.querySelectorAll("[data-say]").forEach(b=>b.addEventListener("click",()=>speak(b.dataset.say)));
}
const sayBtn=(text,label)=>'<button type="button" class="say" data-say="'+esc(text)+'">'+SPK+(label||"듣기")+'</button>';

function home(){
  const doneN=LESSONS.filter(l=>P.done[l.id]).length,allDone=doneN===LESSONS.length;
  const next=LESSONS.find(l=>!P.done[l.id])||LESSONS[0];
  app.innerHTML=
   '<header class="top"><h1>한마디 영어</h1><p>하루 네 문장, 소리 내어 말하는 연습</p></header>'
  +'<section class="stats" aria-label="내 기록"><div class="streak"><span class="num">'+liveStreak()+'</span><span class="unit">일 연속</span></div>'
  +'<dl><div><dt>끝낸 수업</dt><dd>'+doneN+' / '+LESSONS.length+'</dd></div><div><dt>말한 문장</dt><dd>'+P.count+'</dd></div></dl></section>'
  +'<section class="today"><p class="eyebrow">'+(allDone?"복습하기":"오늘의 수업")+'</p><h2>'+esc(next.title)+'</h2><p class="muted">'+esc(next.place)+'</p>'
  +'<p class="peek"><span>'+esc(next.phrases[0].en)+'</span></p>'
  +'<button type="button" class="btn primary" data-start="'+next.id+'">시작하기</button>'
  +'</section>'
  +'<section><h3>전체 수업</h3><ol class="list">'
  +LESSONS.map((l,i)=>'<li><button type="button" data-start="'+l.id+'"><span class="n">'+(i+1)+'</span><span class="t"><b>'+esc(l.title)+'</b><small>'+esc(l.place)+'</small></span><span class="pill'+(P.done[l.id]?" ok":"")+'">'+(P.done[l.id]?"완료":"시작 전")+'</span></button></li>').join("")
  +'</ol></section>'
  +(noMic?'<p class="note">이 브라우저에서는 마이크를 쓸 수 없어요. 크롬 앱에서 이 주소를 열면 소리 내어 연습할 수 있어요.</p>':'')
  +'<footer>기록은 '+savedTo+'에 저장돼요.</footer>';
}

function lesson(){
  const l=byId(view.id),names=["배우기","따라 말하기","대화하기"];
  let h='<nav class="bar" aria-label="수업 단계"><button type="button" class="back" data-home>나가기</button><ol class="steps">'
    +names.map((s,k)=>'<li class="'+(k===view.step?"on":k<view.step?"past":"")+'">'+s+'</li>').join("")+'</ol></nav>';
  if(view.step===0){
    h+='<div class="lead"><h2>'+esc(l.title)+'</h2><p>오늘 배울 네 문장이에요. 듣고 소리 내어 읽어 보세요.</p></div><div class="cards">'
      +l.phrases.map(p=>'<article class="card"><p class="en" lang="en">'+esc(p.en)+'</p><p class="hangul">'+esc(p.say)+'</p><p class="ko">'+esc(p.ko)+'</p>'+sayBtn(p.en)+'</article>').join("")
      +'</div><button type="button" class="btn primary" id="to-repeat">따라 말하러 가기</button>';
    app.innerHTML=h;
    $("#to-repeat").addEventListener("click",()=>{view.step=1;view.i=0;render();window.scrollTo(0,0);});
    return;
  }
  if(view.step===1){
    const p=l.phrases[view.i];
    h+='<div class="lead"><h2>따라 말해 보세요</h2><p class="count">'+(view.i+1)+' / '+l.phrases.length+'</p></div>'
      +'<section class="focus"><p class="ko">'+esc(p.ko)+'</p><p class="en" lang="en">'+esc(p.en)+'</p><p class="hangul">'+esc(p.say)+'</p>'+sayBtn(p.en)+'</section>'
      +'<div id="slot"></div>';
    app.innerHTML=h;
    $("#slot").appendChild(gradedBox(p.en,()=>{
      if(view.i<l.phrases.length-1)view.i++;else{view.step=2;view.i=0;view.hint=false;}
      render();window.scrollTo(0,0);
    }));
    return;
  }
  const t=l.talk[view.i],p=l.phrases[t.you];
  h+='<div class="lead"><h2>'+esc(l.place)+'</h2><p class="count">대화 '+(view.i+1)+' / '+l.talk.length+'</p></div>'
    +(t.them
      ?'<div class="bubble"><p class="en" lang="en">'+esc(t.them)+'</p><p class="ko">'+esc(t.ko)+'</p>'+sayBtn(t.them)+'</div>'
      :'<div class="bubble sys">'+esc(t.ko)+'</div>')
    +'<section class="task"><p class="eyebrow">영어로 답해 보세요</p><p class="ko">'+esc(p.ko)+'</p>'
    +(view.hint?'<p class="en" lang="en">'+esc(p.en)+'</p><p class="hangul">'+esc(p.say)+'</p>':'<button type="button" class="linkbtn" id="hint">생각이 안 나면 힌트 보기</button>')
    +'</section><div id="slot"></div>';
  app.innerHTML=h;
  const hb=$("#hint");if(hb)hb.addEventListener("click",()=>{stopMic();view.hint=true;render();});
  $("#slot").appendChild(gradedBox(p.en,()=>{
    if(view.i<l.talk.length-1){view.i++;view.hint=false;render();window.scrollTo(0,0);}
    else complete(l);
  }));
}

function complete(l){
  const td=today();
  if(P.lastDay!==td){P.streak=(P.lastDay===yesterday())?P.streak+1:1;P.lastDay=td;}
  P.done[l.id]=true;
  P.count+=l.phrases.length+l.talk.length;
  save();
  go({name:"done",id:l.id});
}
function done(){
  const l=byId(view.id);
  app.innerHTML='<section class="done"><p class="eyebrow">수업 완료</p><h2>'+esc(l.title)+', 해냈어요</h2>'
   +'<div class="streak"><span class="num">'+liveStreak()+'</span><span class="unit">일 연속</span></div>'
   +'<p>방금 영어로 '+(l.phrases.length+l.talk.length)+'번 말했어요. 내일 또 만나요.</p>'
   +'<button type="button" class="btn ghost" data-home>홈으로</button></section>';
}

render();
</script>
