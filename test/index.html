<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>한마디 영어</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  /* layout: one phone column, flat white, list rows with hairlines, one fixed action at the bottom */
  --bg:#ffffff; --fill:#f2f4f6; --ink:#191f28; --sub:#5b6573; --faint:#b0b8c1; --line:#e5e8eb;
  --brand:#2f6bff; --on-brand:#ffffff; --ok:#00a86b; --ok-bg:#e8f8f0; --no:#f04452; --no-bg:#fff0f1; --mark:#ffe27a;
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#17171c; --fill:#24242c; --ink:#f2f4f6; --sub:#9ea4ae; --faint:#5a606b; --line:#2e2f38;
    --brand:#5b8cff; --on-brand:#0b1220; --ok:#2fd08b; --ok-bg:#15291f; --no:#ff6b76; --no-bg:#33191c; --mark:#6b5a14;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);word-break:keep-all;-webkit-text-size-adjust:100%}
h1,h2,h3,p,ol,ul{margin:0;padding:0}
ol,ul{list-style:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none !important}
#app{max-width:480px;margin:0 auto;padding:24px 20px 190px}
.fixed{position:fixed;left:0;right:0;margin:0 auto;max-width:480px}

/* tabs + bottom action */
.tabs{bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;display:grid;justify-items:center;gap:2px;padding:9px 0 8px;font-size:11px;font-weight:600;color:var(--faint)}
.tabs button.on{color:var(--ink)}
.cta-wrap{bottom:calc(58px + env(safe-area-inset-bottom));padding:12px 20px;background:linear-gradient(transparent,var(--bg) 30%)}
.cta{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border-radius:16px;background:var(--brand);color:var(--on-brand);font-size:17px;font-weight:700}
.cta.dark{background:var(--ink);color:var(--bg)}
.cta:active{transform:scale(.98)}

/* today */
.date{font-size:14px;color:var(--sub);font-weight:500}
.hero{font-size:26px;font-weight:800;line-height:1.3;letter-spacing:-.02em;margin-top:4px;text-wrap:balance}
.week{display:flex;justify-content:space-between;margin:26px 0 8px}
.week li{display:grid;justify-items:center;gap:8px;font-size:12px;color:var(--sub);font-weight:500}
.week i{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--fill);color:transparent}
.week .did i{background:var(--brand);color:var(--on-brand)}
.week .now{color:var(--ink);font-weight:700}
.week .now:not(.did) i{box-shadow:inset 0 0 0 2px var(--brand);background:transparent}
.sec{font-size:13px;font-weight:700;color:var(--sub);margin:30px 0 4px}
.rows li+li{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 0;min-height:68px}
.row .ic{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:12px;background:var(--fill);font-weight:800;font-size:15px;color:var(--sub);font-variant-numeric:tabular-nums}
.row .ic.done{background:var(--ok-bg);color:var(--ok)}
.row .tx{flex:1;min-width:0;display:grid}
.row b{font-size:17px;font-weight:700}
.row small{font-size:14px;color:var(--sub)}
.row .go{color:var(--faint);flex:none}
.row .chip{flex:none;font-size:13px;font-weight:700;color:var(--brand)}
.row.off b{color:var(--sub)}
.unit{font-size:20px;font-weight:800;margin:30px 0 2px;letter-spacing:-.01em}
.unit:first-child{margin-top:0}
.ptitle{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:22px}

/* stats */
.big{display:flex;align-items:baseline;gap:6px;margin-bottom:22px}
.big b{font-size:60px;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big span{font-size:18px;font-weight:700}
.three{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.three div{flex:1;padding:16px 0}
.three div+div{border-left:1px solid var(--line);padding-left:16px}
.three b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.three span{font-size:13px;color:var(--sub)}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:14px}
.bars li{flex:1;display:grid;grid-template-rows:auto 1fr auto;justify-items:center;gap:6px;height:100%;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.bars .col{align-self:end;width:100%;border-radius:8px 8px 4px 4px;background:var(--fill);min-height:4px}
.bars .now .col{background:var(--brand)}
.bars .now{color:var(--ink);font-weight:700}
.note{font-size:13px;color:var(--sub);margin-top:26px;line-height:1.6}

/* session */
.sbar{display:flex;align-items:center;gap:14px;margin:-6px 0 34px}
.x{display:grid;place-items:center;width:40px;height:40px;margin-left:-10px;color:var(--sub)}
.prog{flex:1;height:8px;border-radius:99px;background:var(--fill);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .25s}
.ex{padding-bottom:120px}
.inst{font-size:15px;font-weight:700;color:var(--brand);margin-bottom:14px}
.en{font-size:30px;font-weight:800;line-height:1.25;letter-spacing:-.02em;overflow-wrap:anywhere}
.say{font-size:17px;color:var(--sub);margin-top:10px}
.ko{font-size:17px;margin-top:4px}
.koq{font-size:28px;font-weight:800;line-height:1.3;letter-spacing:-.02em}
.auds{display:flex;gap:8px;margin-top:22px}
.aud{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:99px;background:var(--fill);font-size:15px;font-weight:600}
.txt{font-size:14px;font-weight:600;color:var(--sub);text-decoration:underline;text-underline-offset:3px;min-height:40px}
.hintb{margin-top:18px}
.ans{margin-top:22px;padding:16px 18px;border-radius:16px;background:var(--fill)}
.ans .en{font-size:22px}
.them{display:inline-block;max-width:92%;padding:14px 18px;border-radius:4px 20px 20px 20px;background:var(--fill)}
.them .t-en{font-size:20px;font-weight:700}
.them .t-ko{font-size:14px;color:var(--sub);margin-top:2px}
.narr{font-size:16px;color:var(--sub)}
.reply{margin-top:30px}
.reply small{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:4px}
.frame{font-size:28px;font-weight:800;line-height:1.3;letter-spacing:-.02em}
.frame u{text-decoration:none;display:inline-block;min-width:54px;border-bottom:4px solid var(--brand)}
.swap{margin-top:26px}
.swap li{display:flex;justify-content:space-between;gap:12px;padding:14px 0;font-size:17px}
.swap li+li{border-top:1px solid var(--line)}
.swap b{font-weight:700}
.swap span{color:var(--sub)}
.word{display:inline-block;margin-top:14px;padding:6px 12px;border-radius:10px;background:var(--fill);font-size:15px;font-weight:600}
.bigplay{display:grid;place-items:center;width:96px;height:96px;border-radius:50%;background:var(--brand);color:var(--on-brand);margin:6px 0 30px}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;padding:16px 18px;border-radius:16px;background:var(--fill);font-size:17px;font-weight:600;min-height:58px}
.opt.ok{background:var(--ok-bg);color:var(--ok)}
.opt.no{background:var(--no-bg);color:var(--no)}

/* dock */
.dock{bottom:0;display:grid;justify-items:center;gap:6px;padding:14px 20px calc(16px + env(safe-area-inset-bottom));background:var(--bg)}
.dock.ok{background:var(--ok-bg)}
.dock.no{background:var(--no-bg)}
.heard{min-height:24px;font-size:16px;color:var(--sub);text-align:center}
.micbtn{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:var(--brand);color:var(--on-brand)}
.micbtn.on{background:var(--no);animation:ring 1.2s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(240,68,82,.45)}100%{box-shadow:0 0 0 22px rgba(240,68,82,0)}}
@media (prefers-reduced-motion:reduce){.micbtn.on{animation:none}.prog i{transition:none}}
.mic-l{font-size:15px;font-weight:700}
.kf{display:flex;gap:8px;width:100%}
.kf input{flex:1;min-width:0;min-height:52px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:17px}
.kf button{min-height:52px;padding:0 18px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700}
.fb{display:grid;gap:8px;width:100%;justify-items:start}
.fb-t{font-size:20px;font-weight:800}
.ok .fb-t{color:var(--ok)}
.no .fb-t{color:var(--no)}
.words{font-size:22px;font-weight:700;line-height:1.5}
.w.hit{background:linear-gradient(transparent 58%,var(--mark) 58%)}
.w.miss{color:var(--no);text-decoration:underline wavy;text-underline-offset:5px}
.fb .sub{font-size:14px;color:var(--sub);overflow-wrap:anywhere}
.fb .cta{margin-top:8px}
.ok .cta{background:var(--ok)}
.fb .txt{justify-self:center}

/* levels */
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--fill);margin-bottom:26px}
.seg button{flex:1;min-height:40px;border-radius:10px;font-weight:700;font-size:15px;color:var(--sub)}
.seg .on{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.lead{font-size:17px;color:var(--sub);margin-top:12px;line-height:1.6}
.kf input.bad{animation:shake .3s;border-color:var(--no)}
.idk{display:block;margin:18px auto 0}

/* words + pictures */
.pic{font-size:68px;line-height:1.1;margin-bottom:12px}
.row .ic.em{font-size:22px}
.row .dn{flex:none;color:var(--ok)}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:24px}
.slot{display:grid;place-items:center;width:32px;height:46px;border-bottom:3px solid var(--line);font-size:26px;font-weight:800}
.slot.on{border-color:var(--brand)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:4px 0 10px}
.tile{width:52px;height:56px;border-radius:14px;background:var(--fill);font-size:24px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.tile:disabled{opacity:.22;box-shadow:none}
.tile.bad{animation:shake .3s;background:var(--no-bg);color:var(--no)}

/* pronunciation */
.tips{margin-top:26px;display:grid;gap:10px;font-size:14px;line-height:1.5;color:var(--sub)}
.tips li{display:flex;gap:10px}
.tips b{flex:none;min-width:44px;height:24px;padding:0 8px;border-radius:8px;background:var(--fill);color:var(--ink);font-weight:700;text-align:center}
.meter{width:100%;height:8px;border-radius:99px;background:rgba(128,128,128,.22);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.fb .tip{font-size:14px;color:var(--ink);line-height:1.5}

/* motion */
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.fb{animation:up .22s ease-out}
.opt.ok,.week .did.now i{animation:pop .3s ease-out}
.opt.no,.dock.no .words{animation:shake .3s}
.micbtn:active{transform:scale(.94)}
.fin h1,.fin .rows{animation:up .35s ease-out both}
.fin .rows{animation-delay:.12s}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.setrow{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 0;margin-top:22px;border-top:1px solid var(--line);font-size:17px;font-weight:600}
.setrow b{color:var(--brand);font-weight:700}
@media (prefers-reduced-motion:reduce){.fb,.opt,.week i,.dock .words,.fin h1,.fin .rows{animation:none !important}}

/* finish */
.fin{padding-top:56px}
.fin h1{font-size:30px;font-weight:800;line-height:1.3;letter-spacing:-.02em}
.fin .rows{margin-top:30px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fin .rows li{display:flex;justify-content:space-between;padding:16px 0;font-size:17px}
.fin .rows b{font-weight:800;font-variant-numeric:tabular-nums}

/* review fixes */
.dock{grid-template-columns:minmax(0,1fr);max-height:62vh;overflow-y:auto}
.dock>*{justify-self:center}
.dock .fb,.dock .kf,.dock .cta{justify-self:stretch}
.dock .words{font-size:19px;line-height:1.45}
.tabs button{color:var(--sub);font-size:12px}
.tabs button.on{color:var(--ink)}
.ok .fb-t{color:#007a4d}
.ok .cta{background:#008556;color:#fff}
.x{width:48px;height:48px;margin-left:-12px}
.txt{min-height:48px;padding:0 12px}
.seg button{min-height:46px}
.micbtn.on{background:var(--brand);animation:ringb 1.2s ease-out infinite}
@keyframes ringb{0%{box-shadow:0 0 0 0 rgba(47,107,255,.45)}100%{box-shadow:0 0 0 22px rgba(47,107,255,0)}}
.pic{display:grid;place-items:center;width:76px;height:76px;border-radius:22px;background:var(--fill);font-size:42px;line-height:1;margin-bottom:16px}
.tips b{text-transform:uppercase}
.say u{display:inline-block;min-width:44px;border-bottom:3px solid var(--brand);text-decoration:none}
.word{display:block;width:fit-content}
.hintb{display:block}
.count{flex:none;font-size:13px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
.appicon{display:block;width:72px;height:72px;border-radius:18px;margin-bottom:20px}
.sw{flex:none;position:relative;width:48px;height:28px;border-radius:99px;background:var(--faint);transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--brand)}
.sw.on::after{transform:translateX(20px)}
.opt.no::after{content:" ✕"}
a.cta{text-decoration:none}
@media (prefers-color-scheme:dark){.ok .fb-t{color:var(--ok)}.ok .cta{background:var(--ok);color:#0b1f16}}
@media (prefers-reduced-motion:reduce){.micbtn.on,.tile.bad,.kf input.bad{animation:none !important}.cta:active,.micbtn:active,.tile:active{transform:none}.sw,.sw::after{transition:none}}
</style>
</head>

<div id="app"></div>
<div id="chrome"></div>
<script>
"use strict";
/* ---------- content ---------- */
const L=[
 {id:"l1",title:"첫인사",sub:"처음 만난 이웃과",
  ph:[{en:"Hello.",say:"헬로우",ko:"안녕하세요."},
      {en:"Nice to meet you.",say:"나이스 투 밋 츄",ko:"만나서 반가워요."},
      {en:"How are you?",say:"하우 아 유?",ko:"어떻게 지내세요?"},

  pat:{frame:"I'm ___.",items:[

        {them:"Nice to meet you too.",ko:"저도 반가워요.",you:2},{them:"I'm great. How about you?",ko:"아주 좋아요. 당신은요?",you:3}]},
 {id:"l2",title:"자기소개",sub:"모임에서 옆자리 사람과",
  ph:[{en:"I'm from Korea.",say:"아임 프럼 코리아",ko:"저는 한국에서 왔어요."},
      {en:"I live in Seoul.",say:"아이 리브 인 서울",ko:"저는 서울에 살아요."},

  talk:[{them:"Where are you from?",ko:"어디에서 오셨어요?",you:0},{them:"Oh, nice! Where do you live?",ko:"오, 좋네요! 어디에 사세요?",you:1},

 {id:"l10",title:"날씨와 안부",sub:"아침에 만난 동료와",

      {en:"I'm a little tired.",say:"아임 어 리틀 타이어드",ko:"조금 피곤해요."},

      {w:"nice",wk:"날씨 좋은",en:"It's nice today.",say:"잇츠 나이스 투데이",ko:"오늘 날씨 좋네요."}]},
  talk:[{them:"Good morning! How's the weather outside?",ko:"좋은 아침! 밖에 날씨 어때요?",you:0},{them:"You look sleepy.",ko:"졸려 보여요.",you:1},
        {them:"Get some rest. I have to go now.",ko:"좀 쉬세요. 저는 이제 가야 해요.",you:2},{them:"You too! Bye!",ko:"당신도요! 안녕!",you:3}]},
 {id:"l3",title:"카페에서 주문하기",sub:"카페 계산대 앞에서",
  ph:[{en:"Can I get a coffee, please?",say:"캔 아이 겟 어 커피, 플리즈?",ko:"커피 한 잔 주시겠어요?"},

      {en:"How much is it?",say:"하우 머치 이즈 잇?",ko:"얼마예요?"}],
  pat:{frame:"Can I get ___, please?",items:[

you":3}],"words":[["company","회사","🏢"],["office","사무실","🖥️"],["busy","바쁜","⏰"],["coworker","직장 동료","🤝"],["gym","헬스장","🏋️"]]}]},{"name":"밖에서 문제 해결하기","lessons":[{"id":"b4","title":"지하철 갈아타기","sub":"승강장에서 옆 사람에게","e":"🚇","ph":[{"en":"Excuse me, does this train go to the airport?","ko":"실례합니다, 이 열차 공항으로 가나요?","say":"익스큐즈 미, 더즈 디스 트레인 고 투 디 에어포트?","e":"✈️"},{"en":"Where do I need to transfer?","ko":"어디서 갈아타야 하나요?","say":"웨어 두 아이 니드 투 트랜스퍼?","e":"🔄"},{"en":"How many stops is it from here?","ko":"여기서 몇 정거장이에요?","say":"하우 메니 스탑스 이즈 잇 프럼 히어?","e":"🚏"},{"en":"Thanks, I really appreciate your help.","ko":"감사합니다, 도와주셔서 정말 고마워요.","say":"땡스, 아이 리얼리 어프리시에이트 유어 헬프.","e":"🙏"}],"pat":{"frame":"Does this train go to ___?","items":[{"w":"the airport","wk":"공항","en":"Does this train go to the airport?","ko":"이 열차 공항으로 가나요?","say":"더즈 디스 트레인 고 투 디 에어포트?"},{"w":"the university","wk":"대학교","en":"Does this train go to the university?","ko":"이 열차 대학교로 가나요?","say":"더즈 디스 트레인 고 투 더 유니버시티?"},{"w":"the stadium","wk":"경기장","en":"Does this train go to the stadium?","ko":"이 열차 경기장으로 가나요?","say":"더즈 디스 트레인 고 투 더 스테이디엄?"}]},"talk":[{"them":"","ko":"지하철 승강장에서 옆 사람에게 공항 가는 열차가 맞는지 물어봐요.","you":0},{"them":"No, it doesn't. You have to change trains.","ko":"아니요, 안 가요. 열차를 갈아타셔야 해요.","you":1},{"them":"At Central Station. Take the blue line there.","ko":"센트럴역에서요. 거기서 파란색 노선을 타세요.","you":2},{"them":"Just three stops. It takes about ten minutes.","ko":"세 정거장만 가면 돼요. 십 분쯤 걸려요.","you":3}],"words":[["subway","지하철","🚇"],["transfer","환승","🔄"],["platform","승강장","🚉"],["airport","공항","✈️"],["ticket","표","🎫"]]},{"id":"b5","title":"약국에서 증상 말하기","sub":"약국에서 약사와","e":"💊","ph":[{"en":"I've had a sore throat since yesterday.","ko":"어제부터 목이 아파요.","say":"아이브 해드 어 소어 쓰로트 신스 예스터데이.","e":"😣"},{"en":"Yes, I also have a slight fever.","ko":"네, 열도 조금 있어요.","say":"예스, 아이 올소 해브 어 슬라이트 피버.","e":"🤒"},{"en":"How often should I take them?","ko":"얼마나 자주 먹어야 하나요?","say":"하우 오픈 슈드 아이 테이크 뎀?","e":"⏰"},{"en":"Will this medicine make me sleepy?","ko":"이 약 먹으면 졸리나요?","say":"윌 디스 메디슨 메이크 미 슬리피?","e":"😪"}],"pat":{"frame":"I've had ___ since yesterday.","items":[{"w":"a sore throat","wk":"목 아픔(인후통)","en":"I've had a sore throat since yesterday.","ko":"어제부터 목이 아파요.","say":"아이브 해드 어 소어 쓰로트 신스 예스터데이."},{"w":"a headache","wk":"두통","en":"I've had a headache since yesterday.","ko":"어제부터 머리가 아파요.","say":"아이브 해드 어 헤데이크 신스 예스터데이."},{"w":"a runny nose","wk":"콧물","en":"I've had a runny nose since yesterday.","ko":"어제부터 콧물이 나요.","say":"아이브 해드 어 러니 노즈 신스 예스터데이."}]},"talk":[{"them":"Hi, how can I help you today?","ko":"안녕하세요, 오늘 무엇을 도와드릴까요?","you":0},{"them":"I see. Do you have any other symptoms?","ko":"그렇군요. 다른 증상도 있으세요?","you":1},{"them":"Okay, I'd recommend these pills. They work well for colds.","ko":"네, 이 알약을 추천해 드려요. 감기에 잘 들어요.","you":2},{"them":"Twice a day, after meals.","ko":"하루에 두 번, 식사 후에 드세요.","you":3}],"words":[["throat","목(목구멍)","😣"],["fever","열","🤒"],["medicine","약","💊"],["cough","기침","🤧"],["pharmacy","약국","⚕️"]]},{"id":"b6","title":"교환·환불 요청하기","sub":"매장 고객센터에서 직원과","e":"🧾","ph":[{"en":"I bought this yesterday, but it doesn't work.","ko":"이거 어제 샀는데, 작동이 안 돼요.","say":"아이 보트 디스 예스터데이, 벗 잇 더즌트 워크.","e":"🔌"},{"en":"Yes, I have the receipt right here.","ko":"네, 영수증 여기 있어요.","say":"예스, 아이 해브 더 리싯 라이트 히어.","e":"🧾"},{"en":"Could I get a refund instead?","ko":"대신 환불받을 수 있을까요?","say":"쿠드 아이 겟 어 리펀드 인스테드?","e":"💵"},{"en":"Could you put it back on my card?","ko":"결제한 카드로 환불해 주시겠어요?","say":"쿠드 유 풋 잇 백 온 마이 카드?","e":"💳"}],"pat":{"frame":"Could I get ___ instead?","items":[{"w":"a refund","wk":"환불","en":"Could I get a refund instead?","ko":"대신 환불받을 수 있을까요?","say":"쿠드 아이 겟 어 리펀드 인스테드?"},{"w":"a new one","wk":"새 제품","en":"Could I get a new one instead?","ko":"대신 새 제품으로 받을 수 있을까요?","say":"쿠드 아이 겟 어 뉴 원 인스테드?"},{"w":"a different color","wk":"다른 색상","en":"Could I get a different color instead?","ko":"대신 다른 색상으로 받을 수 있을까요?","say":"쿠드 아이 겟 어 디퍼런트 컬러 인스테드?"}]},"talk":[{"them":"Hi there. What can I do for you?","ko":"안녕하세요. 무엇을 도와드릴까요?","you":0},{"them":"Oh, I'm sorry about that. Do you have your receipt?","ko":"아, 죄송합니다. 영수증 가지고 계세요?","you":1},{"them":"Thank you. Would you like to exchange it for a new one?","ko":"감사합니다. 새 제품으로 교환해 드릴까요?","you":2},{"them":"Of course. How would you like your refund?","ko":"물론이죠. 환불은 어떻게 해 드릴까요?","you":3}],"words":[["receipt","영수증","🧾"],["refund","환불","💵"],["exchange","교환","🔁"],["broken","고장 난","🔨"],["card","카드","💳"]]}]}]},"3":{"units":[{"name":"의견·문제·경험 전하기","lessons":[{"id":"c1","title":"의견 말하기","sub":"점심시간에 동료와","e":"💬","ph":[{"en":"To be honest, I think working from home has its ups and downs.","ko":"솔직히 말하면, 재택근무는 장단점이 있다고 생각해요.","e":"⚖️"},{"en":"I see your point, but I'm not sure I agree with that.","ko":"무슨 말인지는 알겠는데, 저는 생각이 좀 달라요.","e":"🤔"},{"en":"The way I see it, we get more done without all the interruptions.","ko":"제가 보기엔, 자꾸 방해받을 일이 없으니까 일을 더 많이 해내요.","e":"✅"},{"en":"Let's agree to disagree, but I'm glad we talked it over.","ko":"서로 생각이 다르다는 건 인정하기로 해요. 그래도 터놓고 얘기해서 좋았어요.","e":"🤝"}],"pat":{"frame":"The way I see it, ___.","items":[{"w":"it's worth a try","wk":"한번 해 볼 만하다","en":"The way I see it, it's worth a try.","ko":"제가 보기엔, 한번 해 볼 만해요."},{"w":"we don't have much choice","wk":"선택의 여지가 별로 없다","en":"The way I see it, we don't have much choice.","ko":"제가 보기엔, 우리한테 선택의 여지가 별로 없어요."},{"w":"both sides have a point","wk":"양쪽 다 일리가 있다","en":"The way I see it, both sides have a point.","ko":"제가 보기엔, 양쪽 말 다 일리가 있어요."}]},"talk":[{"them":"So I heard the company's thinking about bringing everyone back to the office full time. What's your take on that?","ko":"회사에서 전 직원을 다시 매일 출근시키는 걸 검토 중이라던데요. 어떻게 생각해요?","you":0},{"them":"Really? Honestly, I think people just slack off when nobody's watching them at home.","ko":"그래요? 솔직히 저는 집에서 보는 사람이 없으면 다들 게으름 피운다고 생각하는데요.","you":1},{"them":"Okay, so what makes you say that? Go ahead, convince me.","ko":"좋아요, 왜 그렇게 생각하는데요? 어디 저를 한번 설득해 봐요.","you":2},{"them":"Hmm, maybe. I still think teams work better face to face, though.","ko":"음, 그럴 수도 있겠네요. 그래도 저는 팀은 얼굴 보고 일하는 게 더 낫다고 생각해요.","you":3}],"words":[["opinion","의견","💭"],["convince","설득하다","🗣️"],["commute","통근하다, 통근","🚇"],["productive","생산적인","📈"],["distract","주의를 흐트러뜨리다","📱"]]},{"id":"c2","title":"문제 알리고 해결 요청하기","sub":"고객센터 상담원과 통화하며","e":"📦","ph":[{"en":"Hi, I'm calling because there seems to be a problem with my order.","ko":"안녕하세요, 주문한 물건에 문제가 좀 있는 것 같아서 전화드렸어요.","e":"📞"},{"en":"The blender I ordered showed up with a crack in the lid.","ko":"주문한 믹서기가 왔는데 뚜껑에 금이 가 있었어요.","e":"💔"},{"en":"Actually, I was wondering if you could send me a replacement instead.","ko":"사실은, 환불 말고 새 제품으로 보내 주실 수 있을까 해서요.","e":"🔄"},{"en":"That would be great. Thanks for taking care of this so quickly.","ko":"그렇게 해 주시면 좋죠. 이렇게 빨리 처리해 주셔서 감사해요.","e":"🙏"}],"pat":{"frame":"I was wondering if you could ___.","items":[{"w":"give me a refund","wk":"환불해 주다","en":"I was wondering if you could give me a refund.","ko":"혹시 환불해 주실 수 있을까 해서요."},{"w":"look into it","wk":"(문제를) 알아봐 주다","en":"I was wondering if you could look into it.","ko":"혹시 그 문제 좀 알아봐 주실 수 있을까 해서요."},{"w":"waive the shipping fee","wk":"배송비를 면제해 주다","en":"I was wondering if you could waive the shipping fee.","ko":"혹시 배송비는 빼 주실 수 있을까 해서요."}]},"talk":[{"them":"Thank you for calling customer support. This is Jamie speaking. How can I help you today?","ko":"고객센터에 전화 주셔서 감사합니다. 저는 제이미입니다. 무엇을 도와드릴까요?","you":0},{"them":"Oh no, I'm sorry to hear that. Could you tell me exactly what's wrong with it?","ko":"아이고, 정말 죄송합니다. 정확히 어떤 문제가 있는지 말씀해 주시겠어요?","you":1},{"them":"I apologize for the trouble. I can go ahead and issue a full refund, if that works for you.","ko":"불편을 드려 죄송합니다. 괜찮으시면 바로 전액 환불해 드릴 수 있어요.","you":2},{"them":"Of course. I'll ship a new one out today, and you should have it by the end of the week.","ko":"물론이죠. 오늘 새 제품을 보내 드릴게요. 이번 주 안에는 받으실 수 있을 거예요.","you":3}],"words":[["refund","환불","💵"],["receipt","영수증","🧾"],["warranty","품질 보증","🛡️"],["damaged","파손된","💥"],["shipment","배송(품)","🚚"]]},{"id":"c3","title":"있었던 일 이야기하기","sub":"카페에서 친구와","e":"📖","ph":[{"en":"You won't believe what happened to us on the way there.","ko":"거기 가는 길에 우리한테 무슨 일이 있었는지 들으면 깜짝 놀랄걸요.","e":"😲"},{"en":"Our car broke down in the middle of nowhere, and it was pouring.","ko":"아무것도 없는 외진 곳에서 차가 고장 났는데, 비까지 억수같이 쏟아지고 있었어요.","e":"🌧️"},{"en":"We ended up waiting half the night for a tow truck.","ko":"결국 견인차를 기다리느라 밤을 절반이나 보냈어요.","e":"⏳"},{"en":"Not at all. Looking back, it turned out to be a great memory.","ko":"전혀요. 지나고 보니 오히려 좋은 추억이 됐더라고요.","e":"😊"}],"pat":{"frame":"We ended up ___.","items":[{"w":"staying an extra night","wk":"하룻밤 더 묵다","en":"We ended up staying an extra night.","ko":"결국 하룻밤 더 묵게 됐어요."},{"w":"taking a taxi home","wk":"택시 타고 집에 가다","en":"We ended up taking a taxi home.","ko":"결국 택시를 타고 집에 갔어요."},{"w":"canceling the whole thing","wk":"전부 다 취소하다","en":"We ended up canceling the whole thing.","ko":"결국 전부 다 취소하고 말았어요."}]},"talk":[{"them":"Hey, how was your trip to the coast last weekend? You look kind of worn out.","ko":"지난 주말에 바닷가 여행은 어땠어요? 좀 지쳐 보이는데요.","you":0},{"them":"Uh-oh, that doesn't sound good. What happened?","ko":"어, 왠지 느낌이 안 좋은데요. 무슨 일이 있었어요?","you":1},{"them":"No way! So what did you do? Were you just stuck out there?","ko":"말도 안 돼요! 그래서 어떻게 했어요? 거기서 그냥 꼼짝 못 한 거예요?","you":2},{"them":"That sounds like a total nightmare. So was the whole trip ruined?","ko":"완전 악몽이었겠네요. 그럼 여행은 통째로 망친 거예요?","you":3}],"words":[["stranded","오도 가도 못하는","🏝️"],["exhausted","기진맥진한","😩"],["nightmare","악몽","😱"],["mechanic","정비사","🔧"],["eventually","결국","🏁"]]}]},{"name":"회의·약속·조언, 한 단계 위로","lessons":[{"id":"c4","title":"회의에서 말하기","sub":"주간 회의에서 팀장과","e":"📊","ph":[{"en":"Sure. We're a little behind schedule, but we're catching up fast.","ko":"네. 일정보다 조금 늦어지긴 했는데, 빠르게 따라잡고 있어요.","e":"🏃"},{"en":"We ran into a few issues with the payment page last week.","ko":"지난주에 결제 페이지에서 예상 못 한 문제가 몇 가지 생겼어요.","e":"🚧"},{"en":"I'm afraid that's not realistic unless we cut some features.","ko":"죄송하지만, 기능을 몇 개 빼지 않는 한 그건 현실적으로 어려워요.","e":"✂️"},{"en":"I'll have a demo ready by Friday and keep you posted.","ko":"금요일까지 데모를 준비해 놓고, 진행 상황은 계속 알려 드릴게요.","e":"📅"}],"pat":{"frame":"I'm afraid that's not realistic unless ___.","items":[{"w":"we hire more people","wk":"사람을 더 뽑다","en":"I'm afraid that's not realistic unless we hire more people.","ko":"죄송하지만, 사람을 더 뽑지 않는 한 그건 현실적으로 어려워요."},{"w":"we push back the launch","wk":"출시를 미루다","en":"I'm afraid that's not realistic unless we push back the launch.","ko":"죄송하지만, 출시를 미루지 않는 한 그건 현실적으로 어려워요."},{"w":"we simplify the design","wk":"디자인을 단순하게 하다","en":"I'm afraid that's not realistic unless we simplify the design.","ko":"죄송하지만, 디자인을 단순하게 하지 않는 한 그건 현실적으로 어려워요."}]},"talk":[{"them":"All right, let's get started. Can you give us a quick update on the website redesign?","ko":"자, 시작하죠. 웹사이트 개편 건, 진행 상황을 간단히 공유해 줄래요?","you":0},{"them":"Okay. What's been holding things up? Anything I should be worried about?","ko":"그렇군요. 뭐 때문에 늦어지고 있는 거죠? 제가 걱정해야 할 일이 있나요?","you":1},{"them":"Got it. The thing is, the client just asked if we could go live a week early. Can we make that happen?","ko":"알겠어요. 그런데 고객사에서 방금 일주일 앞당겨 오픈할 수 있냐고 물어봤거든요. 가능할까요?","you":2},{"them":"Fair enough. Let's stick with the original date, then. When can I see a working version?","ko":"그럴 만하네요. 그럼 원래 날짜대로 가죠. 실제로 돌아가는 버전은 언제 볼 수 있어요?","you":3}],"words":[["deadline","마감 기한","⏰"],["progress","진행 상황, 진척","📶"],["feature","기능","🧩"],["priority","우선순위","🥇"],["launch","출시, 출시하다","🚀"]]},{"id":"c5","title":"약속 잡고 바꾸기","sub":"친구와 전화로","e":"🗓️","ph":[{"en":"About that, I'm so sorry, but something came up at work.","ko":"그게 말인데요, 정말 미안한데 회사에 갑자기 일이 생겼어요.","e":"😥"},{"en":"Unfortunately, no. Would you mind if we moved it to the weekend?","ko":"아쉽지만 안 될 것 같아요. 혹시 주말로 옮겨도 괜찮을까요?","e":"↪️"},{"en":"Saturday works for me, if that's not too much trouble.","ko":"저는 토요일 좋아요. 너무 번거롭지 않다면요.","e":"👌"},{"en":"Perfect. Thanks for being so understanding. Dinner's on me to make up for it.","ko":"좋아요. 이해해 줘서 고마워요. 미안하니까 저녁은 제가 살게요.","e":"🍽️"}],"pat":{"frame":"Would you mind if we ___?","items":[{"w":"met a little later","wk":"조금 늦게 만나다","en":"Would you mind if we met a little later?","ko":"혹시 조금 늦게 만나도 괜찮을까요?"},{"w":"did it online instead","wk":"대신 온라인으로 하다","en":"Would you mind if we did it online instead?","ko":"혹시 대신 온라인으로 해도 괜찮을까요?"},{"w":"picked a different place","wk":"다른 장소로 정하다","en":"Would you mind if we picked a different place?","ko":"혹시 다른 장소로 정해도 괜찮을까요?"}],"note":"Would you mind if 뒤에는 과거형(met, did)을 써요. 가정해서 조심스럽게 묻는 말이에요."},"talk":[{"them":"Hey! Are we still on for dinner tomorrow night? I already booked us a table.","ko":"있잖아요, 내일 저녁 식사 약속 그대로인 거죠? 자리도 벌써 예약해 놨어요.","you":0},{"them":"Oh, that's too bad. So there's no way you can make it, even a bit later?","ko":"아, 아쉽네요. 그럼 조금 늦게라도 올 방법이 전혀 없는 거예요?","you":1},{"them":"Sure, no problem. I'm free Saturday, but Sunday's kind of packed. What works for you?","ko":"그럼요, 괜찮아요. 저는 토요일은 한가한데 일요일은 일정이 좀 빡빡해요. 언제가 좋아요?","you":2},{"them":"Not at all. I'll call the restaurant and change the reservation. Same time as before?","ko":"전혀 번거롭지 않아요. 제가 식당에 전화해서 예약을 바꿀게요. 시간은 원래대로 할까요?","you":3}],"words":[["reschedule","일정을 다시 잡다","🔁"],["available","시간이 되는","🟢"],["postpone","미루다, 연기하다","⏭️"],["confirm","확정하다, 확인하다","☑️"],["convenient","편리한, (시간이) 괜찮은","🙆"]]},{"id":"c6","title":"가정하고 조언하기","sub":"고민을 털어놓는 친구와","e":"🧭","ph":[{"en":"If I were you, I'd think about what matters most in the long run.","ko":"저라면 길게 봤을 때 뭐가 제일 중요한지 생각해 볼 것 같아요.","e":"🔭"},{"en":"I have, actually. I should have taken a chance when I was younger.","ko":"사실 있어요. 저도 더 젊었을 때 과감하게 도전해 봤어야 했는데 말이에요.","e":"😔"},{"en":"Even if it didn't work out, you would learn a lot from it.","ko":"설령 일이 잘 안 풀린다 해도, 거기서 배우는 게 많을 거예요.","e":"🌱"},{"en":"Why don't you sleep on it and see how you feel tomorrow?","ko":"하룻밤 푹 자면서 생각해 보고, 내일 마음이 어떤지 보는 게 어때요?","e":"🌙"}],"pat":{"frame":"If I were you, I'd ___.","items":[{"w":"take the offer","wk":"제안을 받아들이다","en":"If I were you, I'd take the offer.","ko":"저라면 그 제안을 받아들일 거예요."},{"w":"ask for more time","wk":"시간을 더 달라고 하다","en":"If I were you, I'd ask for more time.","ko":"저라면 시간을 좀 더 달라고 할 거예요."},{"w":"talk to your boss first","wk":"먼저 상사와 이야기하다","en":"If I were you, I'd talk to your boss first.","ko":"저라면 먼저 상사와 이야기해 볼 거예요."}]},"talk":[{"them":"So I got a job offer from a startup. The work sounds really exciting, but the pay's lower, and I just can't make up my mind.","ko":"저 스타트업에서 입사 제안을 받았어요. 일은 정말 재미있을 것 같은데 월급이 더 적어서, 도저히 마음을 못 정하겠어요.","you":0},{"them":"Yeah, I guess you're right. Have you ever been in this kind of situation yourself?","ko":"네, 그 말이 맞는 것 같아요. 혹시 이런 상황에 처해 본 적 있어요?","you":1},{"them":"Really? But what if the company goes under and I end up with nothing?","ko":"정말요? 그런데 회사가 망해서 저한테 아무것도 안 남으면 어떡하죠?","you":2},{"them":"That's true. I'm just scared of making the wrong call, and they want an answer soon.","ko":"그건 그래요. 그냥 잘못된 선택을 할까 봐 겁이 나요. 그쪽에서는 빨리 답을 달라고 하고요.","you":3}],"words":[["regret","후회, 후회하다","😞"],["hesitate","망설이다","🫤"],["salary","급여, 월급","💰"],["career","경력, 직업","💼"],["decision","결정","🔀"]]}]}]}}/*END*/;

let AC=null;
function note(f,at,dur,type,vol){
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+at;
  o.type=type||"sine";o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.02);
}
function sfx(name){
  if(!P.snd)return;
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C)return;
    AC=AC||new C();
    if(AC.state==="suspended")AC.resume();
    if(name==="tap")note(520,0,0.06,"sine",0.08);
    else if(name==="miss")note(196,0,0.1,"sine",0.14);
    else if(name==="ok"){note(659,0,0.14,"triangle");note(988,0.1,0.26,"triangle");}
    else if(name==="perfect"){note(659,0,0.12,"triangle");note(831,0.09,0.12,"triangle");note(1319,0.18,0.34,"triangle");}
    else if(name==="no"){note(233,0,0.16,"sine",0.2);note(185,0.13,0.26,"sine",0.2);}
    else if(name==="done"){[523,659,784,1047].forEach((f,i)=>note(f,i*0.11,0.22,"triangle"));[523,659,784,1047].forEach(f=>note(f,0.5,0.7,"sine",0.1));}
  }catch(e){}
}

function confetti(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const c=document.createElement("canvas");c.id="confetti";document.body.appendChild(c);
  const x=c.getContext("2d"),W=c.width=innerWidth,H=c.height=innerHeight;
  const cols=["#2f6bff","#ffcf33","#9db8ff"];
  const ps=[];for(let i=0;i<90;i++)ps.push({x:Math.random()*W,y:-20-Math.random()*H*0.5,vx:(Math.random()-0.5)*3,vy:3+Math.random()*4,s:5+Math.random()*6,r:Math.random()*6,vr:(Math.random()-0.5)*0.3,c:cols[i%cols.length]});
  const t0=performance.now();
  (function tick(now){
    x.clearRect(0,0,W,H);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});
    if(now-t0<2600)requestAnimationFrame(tick);else c.remove();
  })(t0);
}

const TIPS=[
 [/th/,"th","혀끝을 윗니 아래에 살짝 물고 바람을 내요."],
 [/f|ph/,"f","윗니를 아랫입술에 살짝 대고 바람 소리를 내요. 입술을 붙이는 'ㅍ'가 아니에요."],
 [/v/,"v","f와 같은 입 모양에서 목을 울려요. 'ㅂ'가 아니에요."],
 [/r/,"r","혀끝이 입천장에 닿지 않게 뒤로 살짝 말아요."],
 [/l/,"l","혀끝을 윗니 바로 뒤에 꾹 대요."]
];
function tipsFor(words,max){
  const out=[];
  TIPS.forEach(t=>{
    if(out.length>=max)return;
    const w=words.map(x=>x.toLowerCase().replace(/[^a-z'-]/g,"")).find(x=>t[0].test(x));
    if(w)out.push({k:t[1],w:w,t:t[2]});
  });
  return out;
}
let recBusy=false,cmpStop=null;
function stopCmp(){if(cmpStop){const f=cmpStop;cmpStop=null;f();}}
async function compare(en,btn){
  if(recBusy)return;
  if(!navigator.mediaDevices||!window.MediaRecorder){btn.textContent="여기서는 녹음이 안 돼요. 크롬에서 열어 주세요";btn.disabled=true;return;}
  recBusy=true;stopMic();
  try{speechSynthesis.cancel();}catch(e){}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}
  catch(e){recBusy=false;btn.textContent="마이크를 허용해야 녹음할 수 있어요";return;}
  let mr;
  try{mr=new MediaRecorder(stream);}
  catch(e){stream.getTracks().forEach(t=>t.stop());recBusy=false;btn.textContent="여기서는 녹음이 안 돼요. 크롬에서 열어 주세요";return;}
  const chunks=[];
  cmpStop=()=>{try{if(mr.state!=="inactive")mr.stop();}catch(e){}};
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  mr.onstop=()=>{
    stream.getTracks().forEach(t=>t.stop());
    cmpStop=null;
    if(!btn.isConnected){recBusy=false;return;}
    const url=URL.createObjectURL(new Blob(chunks,{type:mr.mimeType||"audio/webm"}));
    const a=new Audio(url);
    let moved=false;
    const after=()=>{
      if(moved)return;moved=true;
      URL.revokeObjectURL(url);
      if(!btn.isConnected){recBusy=false;return;}
      btn.textContent="본보기 발음 재생 중";
      speak(en);
      setTimeout(()=>{recBusy=false;if(btn.isConnected){btn.textContent="다시 들어 보기";btn.disabled=false;}},900+en.length*75);
    };
    btn.textContent="내 목소리 재생 중";
    a.onended=after;a.onerror=after;
    a.play().catch(after);
  };
  btn.disabled=true;btn.textContent="녹음 중… 지금 말하세요";
  mr.start();
  setTimeout(()=>{try{if(mr.state!=="inactive")mr.stop();}catch(e){}},Math.min(7000,1800+en.split(" ").length*550));
}

/* ---------- grading ---------- */
const FIX={"i'm":"i am","im":"i am","i'll":"i will","it's":"it is","its":"it is","don't":"do not","dont":"do not","how's":"how is",
  "1":"one","2":"two","3":"three","4":"four","5":"five","ok":"okay","thankyou":"thank you","thanks":"thank you",
  "ive":"i have","lets":"let us","thats":"that is","doesnt":"does not","didnt":"did not","wont":"will not","cant":"can not","id":"i would","ill":"i will","whats":"what is","isnt":"is not","youre":"you are","checkout":"check out","wi-fi":"wifi","restroom":"rest room","latte":"latte"};
const CONTR={"won't":"will not","can't":"can not","let's":"let us","cannot":"can not","gonna":"going to","wanna":"want to","gotta":"got to"};
function toks(w){
  w=w.toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9'-]/g,"").replace(/^[-']+|[-']+$/g,"");
  if(!w)return [];
  if(FIX[w])return FIX[w].split(" ");
  if(CONTR[w])return CONTR[w].split(" ");
  let m;
  if((m=w.match(/^(.+)n't$/)))return [m[1],"not"];
  if((m=w.match(/^(.+)'(m|re|ll|ve|d)$/)))return [m[1],{m:"am",re:"are",ll:"will",ve:"have",d:"would"}[m[2]]];
  if((m=w.match(/^(it|that|what|how|there|here|he|she|where|who|when)'s$/)))return [m[1],"is"];
  w=w.replace(/['-]/g,"");
  return (FIX[w]||w).split(" ");
}
function grade(target,said){
  const ow=target.split(/\s+/),t=[],owner=[];
  ow.forEach((w,i)=>toks(w).forEach(k=>{t.push(k);owner.push(i);}));
  const s=said.split(/\s+/).flatMap(toks);
  const m=t.length,n=s.length,dp=[];
  for(let i=0;i<=m;i++)dp.push(new Array(n+1).fill(0));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=t[i-1]===s[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  const hit=new Array(m).fill(false);
  let i=m,j=n;
  while(i>0&&j>0){
    if(t[i-1]===s[j-1]){hit[i-1]=true;i--;j--;}
    else if(dp[i-1][j]>=dp[i][j-1])i--;else j--;
  }
  const words=ow.map((w,idx)=>({text:w,hit:owner.every((o,k)=>o!==idx||hit[k])}));
  let score=m?dp[m][n]/m:0;
  if(t.includes("not")!==s.includes("not"))score=Math.min(score,0.5);
  return {score:score,words:words,said:n,need:m};
}

const lvOf=k=>k[0]==="c"?3:k[0]==="b"?2:1;
function passFor(ex){
  if(ex.card)return LV[lvOf(ex.card)].pass;
  return ex.t==="learn"?Math.min(M().pass,0.75):M().pass;
}

function startLesson(id){
  const l=LMAP[id],q=[],ws=shuffle(l.words).slice(0,2);
  const picQ=wd=>({t:"pic",wd:wd,ans:wd.w,fbA:wd.e+" "+wd.w,fbB:wd.ko,spk:wd.w,
    opts:shuffle([wd.w].concat(shuffle(l.words.filter(x=>x!==wd)).slice(0,2).map(x=>x.w)))});
  l.ph.forEach(p=>q.push({t:"learn",p:p,en:p.en}));
  ws.forEach(wd=>q.push(picQ(wd)));
  if(TTS){
    const th=l.talk.filter(t=>t.them);
    if(th.length>=3){
      const tk=shuffle(th)[0];
      q.push({t:"listen",say:tk.them,ans:tk.ko,fbA:tk.them,fbB:tk.ko,opts:shuffle([tk.ko].concat(shuffle(th.filter(x=>x!==tk)).slice(0,2).map(x=>x.ko)))});
    }else{
      const i=Math.floor(Math.random()*l.ph.length),pp=l.ph[i];
      q.push({t:"listen",say:pp.en,ans:pp.ko,fbA:pp.en,fbB:(M().say&&pp.say)||pp.ko,opts:shuffle([pp.ko].concat(shuffle(l.ph.filter((x,k)=>k!==i)).slice(0,2).map(x=>x.ko)))});
    }
  }
  shuffle(l.ph).forEach(p=>q.push({t:"recall",p:p,en:p.en}));
  ws.forEach(wd=>q.push({t:"spell",wd:wd,hard:M().spell!=="tiles"}));
  q.push({t:"frame",l:l});
  l.pat.items.forEach(p=>q.push({t:"pat",p:p,en:p.en,l:l}));
  q.push({t:"free",l:l});
  Object.keys(P.cards).filter(k=>k.split(":")[0]!==id&&k.indexOf(":w")<0&&cardData(k))
    .sort((a,b)=>P.cards[a].due<P.cards[b].due?-1:P.cards[a].due>P.cards[b].due?1:0).slice(0,2)
    .forEach(k=>{const p=cardData(k);q.push({t:"recall",p:p,en:p.en,card:k,old:true});});
  l.talk.forEach(tk=>q.push({t:"talk",tk:tk,p:l.ph[tk.you],en:l.ph[tk.you].en,l:l}));
  S={kind:"lesson",id:id,q:q,i:0,said:0};enter();showEx();
}
function startReview(){
  const keys=dueKeys().sort((a,b)=>P.cards[a].due<P.cards[b].due?-1:P.cards[a].due>P.cards[b].due?1:0).slice(0,12);
  const q=shuffle(keys).map(k=>{
    const p=cardData(k),c=P.cards[k];
    if(p.w&&!p.en)return {t:"spell",wd:p,card:k,hard:M().spell!=="tiles"};
    return (TTS&&c.lv>=2&&c.lv<=3)?{t:"echo",p:p,en:p.en,card:k}:{t:"recall",p:p,en:p.en,card:k};
  });
  if(!q.length)return;
  S={kind:"review",q:q,i:0,said:0};enter();showEx();
}

  }else if(ex.t==="pat"){
    const f=esc(ex.l.pat.frame).replace("___","<u>&nbsp;</u>");
    m='<p class="inst">빈칸에 넣어 말해요</p><h1 class="koq">'+esc(p.ko)+'</h1><p class="say" lang="en">'+f+'</p><span class="word">'+esc(p.wk)+' = '+esc(p.w)+'</span>'+hidden(p);
  }else if(ex.t==="free"){
    const f=esc(ex.l.pat.frame).replace("___","<u>&nbsp;</u>");

     +(open?'<div class="reply"><small>이 뜻으로 대답해요</small><h1 class="koq">'+esc(p.ko)+'</h1>'+hidden(p)+'</div>'

function bindAud(root){root.querySelectorAll("[data-say]").forEach(b=>b.addEventListener("click",()=>{stopMic();speak(b.dataset.say,+b.dataset.rate);}));}
function reveal(){const a=$("#ans"),h=$("#hint");if(a){a.hidden=false;if(!a.dataset.b){a.dataset.b="1";bindAud(a);}}if(h)h.hidden=true;}
function next(){
  S.i++;
  if(S.i>=S.q.length)finish();else showEx();
}
function bindListen(ex){
  const dock=$("#dock");
  app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    if(b.textContent===ex.ans){
      app.querySelectorAll(".opt").forEach(o=>{o.disabled=true;});
      b.classList.add("ok");sfx("ok");
      dock.className="dock fixed ok";
      dock.innerHTML='<div class="fb" role="status"><p class="fb-t">맞아요</p><p class="words" lang="en">'+esc(ex.fbA)+'</p><p class="sub">'+esc(ex.fbB)+'</p><button type="button" class="cta" id="nx">다음</button></div>';
      $("#nx").addEventListener("click",next);
      if(ex.spk)speak(ex.spk,0.85);
      fit();
    }else{b.classList.add("no");b.disabled=true;sfx("no");}
  }));
}
function dockSpell(ex){

  let pos=0,miss=0,shown=false;
  const done=()=>{
    slots.forEach((sl,i)=>{sl.textContent=w[i];sl.classList.add("on");});
    if(ex.card)grow(ex.card,shown?-2:miss===0?1:0);
    save();sfx(miss?"ok":"perfect");speak(w,0.85);
    dock.className="dock fixed ok";
    dock.innerHTML='<div class="fb" role="status"><p class="fb-t">'+(miss?"완성했어요":"한 번에 썼어요")+'</p><p class="words" lang="en">'+esc(ex.wd.e+" "+w)+'</p><p class="sub">'+esc(ex.wd.ko)+'</p><button type="button" class="cta" id="nx">다음</button></div>';
    $("#nx").addEventListener("click",next);
    fit();
  };
  dock.className="dock fixed";
  if(M().spell==="type"){
    $(".inst",app).textContent="단어를 직접 써요";
    dock.innerHTML='<p class="heard" id="heard" aria-live="polite"></p><form class="kf" id="kf"><label class="sr" for="kin">영어 단어 입력</label><input id="kin" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어 단어"><button type="submit">확인</button></form>';
    const kin=$("#kin"),heard=$("#heard");
    $("#kf").addEventListener("submit",e=>{
      e.preventDefault();
      const v=kin.value.trim().toLowerCase();
      if(!v)return;
      if(v===w){done();return;}
      miss++;sfx("miss");
      kin.classList.remove("bad");void kin.offsetWidth;kin.classList.add("bad");
      if(miss>=3){shown=true;heard.textContent="정답: "+w+" · 보고 한 번 써 보세요";}
      else heard.textContent=miss===2?"힌트: "+w.slice(0,Math.max(1,Math.ceil(w.length/2)))+"…":"철자가 달라요. 다시 써 보세요.";
      fit();
    });
    return;
  }
  let letters=w.split("");
  if(ex.hard)letters=letters.concat(shuffle("aeioustrnl".split("").filter(c=>!w.includes(c))).slice(0,2));
  let sh=shuffle(letters);
  if(sh.join("")===w&&w.length>1)sh=sh.reverse();
  dock.innerHTML='<div class="tiles" lang="en">'+sh.map(c=>'<button type="button" class="tile">'+c+'</button>').join("")+'</div>';
  dock.querySelectorAll(".tile").forEach(b=>b.addEventListener("click",()=>{
    if(b.textContent!==w[pos]){
      miss++;b.classList.remove("bad");void b.offsetWidth;b.classList.add("bad");sfx("miss");
      setTimeout(()=>b.classList.remove("bad"),350);
      return;
    }
    slots[pos].textContent=w[pos];slots[pos].classList.add("on");b.disabled=true;pos++;sfx("tap");
    if(pos===w.length)done();
  }));
}
function dockMic(ex){
  const dock=$("#dock");
  dock.className="dock fixed";
  dock.innerHTML='<p class="heard" id="heard" aria-live="polite"></p>'
   +(SR?'<button type="button" class="micbtn" id="mic" aria-label="눌러서 말하기">'+I.mic+'</button><p class="mic-l" id="micl">눌러서 말하기</p><button type="button" class="txt" id="kb">글자로 쓰기</button>':"")
   +'<form class="kf" id="kf"'+(SR?" hidden":"")+'><label class="sr" for="kin">영어로 입력</label><input id="kin" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 입력"><button type="submit">확인</button></form>';
  const heard=$("#heard"),kf=$("#kf"),kin=$("#kin");
  kf.addEventListener("submit",e=>{e.preventDefault();const t=kin.value.trim();if(t)answer(ex,t,[]);});
  fit();
  if(!SR)return;
  const mic=$("#mic"),micl=$("#micl");
  $("#kb").addEventListener("click",()=>{kf.hidden=false;$("#kb").hidden=true;kin.focus();fit();});
  const setOn=on=>{mic.classList.toggle("on",on);mic.setAttribute("aria-label",on?"듣는 중, 누르면 멈춰요":"눌러서 말하기");micl.textContent=on?"듣고 있어요":"눌러서 말하기";};
  mic.addEventListener("click",()=>{
    if(rec){try{rec.stop();}catch(e){}return;}
    stopCmp();
    try{speechSynthesis.cancel();}catch(e){}
    const r=new SR();rec=r;
    r.lang="en-US";r.interimResults=true;r.continuous=false;r.maxAlternatives=3;
    const finals=[],alts=[];let err="",conf=0;
    heard.textContent=P.mic?"":"'마이크 허용' 창이 뜨면 '허용'을 눌러 주세요.";
    r.onstart=()=>{setOn(true);if(!P.mic){P.mic=1;save();heard.textContent="";}};
    r.onresult=e=>{
      let live="";
      for(let i=e.resultIndex;i<e.results.length;i++){
        const res=e.results[i];
        if(res.isFinal){finals.push(res[0].transcript);if(finals.length===1){conf=res[0].confidence||0;for(let k=1;k<res.length;k++)alts.push(res[k].transcript);}}
        else live+=res[0].transcript;
      }
      heard.textContent=(finals.join(" ")+" "+live).trim();
    };
    r.onerror=e=>{err=e.error||"error";};
    r.onend=()=>{
      if(rec===r)rec=null;
      if(!mic.isConnected)return;
      setOn(false);
      if(err==="aborted")return;
      if(err==="not-allowed"||err==="service-not-allowed"){heard.textContent="마이크가 꺼져 있어요. 휴대폰 설정 > 앱 > Chrome > 권한에서 마이크를 허용하거나, 아래 '글자로 쓰기'를 눌러 주세요.";fit();return;}
      const text=finals.join(" ").trim();
      if(!text){heard.textContent="잘 안 들렸어요. 한 번 더 눌러 말해 주세요.";return;}
      answer(ex,text,finals.length===1?alts:[],finals.length===1?conf:0);
    };
    try{r.start();}catch(e){rec=null;setOn(false);heard.textContent="마이크를 켤 수 없어요. '글자로 쓰기'를 눌러 주세요.";}
  });
}
function answer(ex,text,alts,conf){
  conf=conf||0;
  const dock=$("#dock"),isFree=ex.t==="free";
  const target=isFree?ex.l.pat.frame.replace("___"," "):ex.en;
  alts=(alts||[]).concat(text.replace(/(\w)['’]s\b/g,"$1 is"));
  let g=grade(target,text),best=text;
  alts.forEach(a=>{const x=grade(target,a);if(x.score>g.score){g=x;best=a;}});
  if(best!==text)conf=Math.min(conf,0.6);
  const extra=g.said-g.need;
  const ok=isFree?(g.score>=0.8&&extra>=1):g.score>=passFor(ex);
  const marks=g.words.map(w=>'<span class="w '+(w.hit?"hit":"miss")+'">'+esc(w.text)+'</span>').join(" ");
  const clear=conf>0?'<p class="sub">'+(conf>=0.9?"아주 또렷하게 들렸어요":conf>=0.75?"잘 들렸어요":"조금 흐리게 들렸어요. 천천히 또박또박 말해 봐요")+'</p><div class="meter"><i style="width:'+Math.round(conf*100)+'%"></i></div>':"";
  const cmp='<button type="button" class="txt" id="cmp">내 발음 들어 보기</button>';
  const cmpEn=isFree?best:ex.en;
  if(ok){
    const perfect=!isFree&&g.score===1&&extra<2;
    S.said++;P.days[today()]=(P.days[today()]||0)+1;
    if(ex.card)grow(ex.card,S.hint?-2:S.first?1:0);
    save();
    sfx(perfect?"perfect":"ok");
    try{navigator.vibrate&&navigator.vibrate(20);}catch(e){}
    reveal();
    dock.className="dock fixed ok";
    dock.innerHTML='<div class="fb" role="status"><p class="fb-t">'+(isFree?"좋아요, 내 문장이에요":perfect?"정확해요":"좋아요, 통해요")+'</p><p class="words" lang="en">'+(isFree?esc(best):marks)+'</p>'+clear+'<button type="button" class="cta" id="nx">다음</button>'+cmp+'</div>';
    $("#nx").addEventListener("click",next);
  }else{
    S.first=false;S.fails++;sfx("no");
    try{navigator.vibrate&&navigator.vibrate([30,40,30]);}catch(e){}
    reveal();
    const title=isFree?(g.score>=0.8?"빈칸에 들어갈 말도 넣어 주세요":"문장 틀을 살려서 말해 봐요"):"조금만 더요";
    dock.className="dock fixed no";
    dock.innerHTML='<div class="fb" role="status"><p class="fb-t">'+title+'</p><p class="words" lang="en">'+marks+'</p><p class="sub">내가 한 말: '+esc(best)+'</p>'
     +(isFree?"":tipsFor(g.words.filter(w=>!w.hit).map(w=>w.text),1).map(x=>'<p class="tip"><b lang="en">'+esc(x.w)+'</b>의 '+x.k.toUpperCase()+' 소리: '+x.t+'</p>').join(""))
     +'<button type="button" class="cta dark" id="re">다시 말하기</button>'+cmp
     +(S.fails>=2?'<button type="button" class="txt" id="skip">건너뛰기</button>':"")+'</div>';
    $("#re").addEventListener("click",()=>dockMic(ex));
    const sk=$("#skip");
    if(sk)sk.addEventListener("click",()=>{if(ex.card){grow(ex.card,-2);save();}next();});
  }
  $("#cmp").addEventListener("click",e=>compare(cmpEn,e.currentTarget));
  fit();
}
function grow(k,d){
  const c=P.cards[k];if(!c)return;
  c.lv=Math.max(0,Math.min(c.lv+d,INT.length-1));
  c.due=plusDays(INT[c.lv]);
}
function finish(){
  let extra="",note="";
  P.days[today()]=P.days[today()]||1;
  if(S.kind==="lesson"){
    const l=LMAP[S.id];
    P.done[l.id]=true;addCards(l,plusDays(1));
    extra='<li><span>내일 복습할 문장·단어</span><b>'+(l.ph.length+l.pat.items.length+l.words.length)+'개</b></li>';
    const standalone=window.matchMedia&&matchMedia("(display-mode:standalone)").matches;
    if(Object.keys(P.done).length===1)note='<p class="note">'+(standalone?"":"홈 화면에 추가하면 내일도 바로 열 수 있어요. 크롬 오른쪽 위 ⋮ > '홈 화면에 추가'를 눌러요.<br>")+'기록은 이 휴대폰에만 저장돼요. 인터넷 사용 기록을 지우면 함께 사라져요.</p>';
  }
  save();
  const st=streak(),title=S.kind==="lesson"?esc(LMAP[S.id].title)+" 수업을 마쳤어요":"복습을 마쳤어요";
  app.innerHTML='<div class="fin"><h1>'+title+'</h1><ul class="rows"><li><span>방금 영어로 말한 횟수</span><b>'+S.said+'번</b></li><li><span>연속 학습</span><b>'+st+'일</b></li>'+extra+'</ul>'+note+'</div>';
  chrome.innerHTML='<div class="dock fixed"><button type="button" class="cta" id="home">홈으로</button></div>';
  sfx("done");confetti();
  $("#home").addEventListener("click",()=>{tab="today";show();window.scrollTo(0,0);});
  S=null;
}
load();show();
</script>
