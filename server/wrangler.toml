# Cloudflare Worker settings for the relay. Keys are NOT stored here:
# they are added as encrypted secrets in the Cloudflare dashboard (or `wrangler secret put NAME`).
#   APP_TOKEN            access code you choose; typed once into the app's settings
#   LLM_API_KEY          key for the AI model
#   AZURE_SPEECH_KEY     key for natural voice + pronunciation assessment (optional)
name = "hanmadi-relay"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
LLM_PROVIDER = "anthropic"          # or "openai" for any OpenAI-compatible service (set LLM_BASE_URL)
LLM_MODEL = "claude-haiku-5-5"
AZURE_SPEECH_REGION = "koreacentral"
TTS_VOICE = "en-US-JennyNeural"
ALLOW_ORIGIN = "https://seoyong5510-cloud.github.io"
# Price per million tokens, used only to show estimated cost in the app.
PRICE_IN = "1"
PRICE_OUT = "5"
